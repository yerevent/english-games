<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd93d">
<title>ABC &amp; 123 — English Games</title>

<!--
  ============================================================================
  ABC & 123 — letters and numbers for young learners.
  No server, no login, nothing to install. One file.

  WHAT IS INSIDE
    Learn the alphabet      big letter + picture + the word
    Big & small letters     matching game (A with a)
    Letter and picture      matching game (A with the apple)
    Learn numbers           numeral + the word + things to count
    Number and word         matching game (3 with three)
    Count and match         matching game (3 with three balloons)

  CHANGING A WORD
    Scroll down to "THE ALPHABET". Each line looks like this:
        { l:"A", word:"apple", art:"apple" },
    The words are the ones Family and Friends 1 uses (Units 1-6 phonics).
    You may change  word:"apple"  to another word starting with A.
    But "art" is the name of the drawing, and only the drawings listed in
    "THE DRAWINGS" exist. So if you change the word you will normally want to
    keep the old picture, or ask for a new drawing to be added.

  HOW MANY PAIRS IN ONE ROUND
    Every letter or number in the chosen range is played. Up to
    MAX_PAIRS (10) fit on one board; a bigger range is split into
    several rounds so nothing is left out.
  ============================================================================
-->

<style>
:root{
  color-scheme: light;
  --sky:#eaf4ff;
  --ink:#2a2f45;
  --muted:#6b7391;
  --card:#ffffff;
  --line:#dfe6f5;
  --shadow:0 4px 0 rgba(42,47,69,.10), 0 10px 24px rgba(42,47,69,.10);
  --r:22px;

  --c1:#ff6b6b; --c2:#ffa63d; --c3:#ffd93d; --c4:#4ecb71;
  --c5:#3ec5e0; --c6:#5b8cff; --c7:#a878ff; --c8:#ff7ac0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--sky);
  background-image:
    radial-gradient(circle at 12% 8%, #fff3c4 0 22%, transparent 55%),
    radial-gradient(circle at 88% 4%, #ffe0ec 0 20%, transparent 55%),
    radial-gradient(circle at 50% 100%, #d9f7e6 0 30%, transparent 60%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Comic Sans MS","Chalkboard SE","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:17px; line-height:1.45; font-weight:700;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:28px;margin:0;line-height:1.2}
h2{font-size:20px;margin:0}
p{margin:0}
.muted{color:var(--muted);font-weight:700}
.small{font-size:14px}
.center{text-align:center}
.hide{display:none !important}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:10px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;min-height:52px;margin-bottom:10px}
.iconbtn{
  border:3px solid var(--line);background:var(--card);color:var(--ink);
  width:48px;height:48px;border-radius:16px;font-size:22px;cursor:pointer;
  display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(42,47,69,.10);
  font-family:inherit;
}
.iconbtn:active{transform:translateY(2px);box-shadow:none}
.top .grow{flex:1;min-width:0;text-align:center;font-size:17px;font-weight:800}

/* ---------- home tiles ---------- */
.tile{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;
  font-family:inherit;font-size:19px;font-weight:800;color:#26304a;
  box-shadow:0 5px 0 rgba(42,47,69,.16), 0 10px 22px rgba(42,47,69,.12);
}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(42,47,69,.16)}
.tile .emoji{font-size:34px;line-height:1;flex:none}
.tile .sub{display:block;font-size:13.5px;font-weight:700;opacity:.75;margin-top:2px}
.t1{background:linear-gradient(135deg,#ffe08a,#ffc93d)}
.t2{background:linear-gradient(135deg,#a8e6a1,#5ecf7d)}
.t3{background:linear-gradient(135deg,#a9d9ff,#6fb4ff)}
.t4{background:linear-gradient(135deg,#ffc0d4,#ff8fb4)}
.t5{background:linear-gradient(135deg,#d9c2ff,#b18cff)}
.t6{background:linear-gradient(135deg,#ffd0a8,#ffab6b)}

.section-label{font-size:15px;font-weight:800;color:var(--muted);margin:8px 2px 0}

/* ---------- generic card ---------- */
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}

/* ---------- buttons ---------- */
.btn{
  border:0;border-radius:18px;padding:14px 22px;font-family:inherit;
  font-size:19px;font-weight:800;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#5b8cff,#3f6fe0);
  box-shadow:0 5px 0 rgba(42,47,69,.20);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(42,47,69,.20)}
.btn.go{background:linear-gradient(135deg,#5ed67f,#33b45f)}
.btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 rgba(42,47,69,.10)}
.btn.big{width:100%;font-size:22px;padding:18px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- range picker ---------- */
.pickrow{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
select{
  font-family:inherit;font-size:26px;font-weight:800;color:var(--ink);
  border:3px solid var(--line);border-radius:16px;background:var(--card);
  padding:8px 10px;min-width:88px;text-align:center;box-shadow:0 3px 0 rgba(42,47,69,.08);
}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{
  border:3px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 14px;font-family:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;
}
.chip:active{transform:translateY(2px)}
.chip.on{background:#ffd93d;border-color:#f0bf1d}
.preview{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  font-size:20px;font-weight:800;color:#3f4a6b
}
.preview span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:2px 8px}

/* ---------- learn card ---------- */
.learn{
  background:var(--card);border:4px solid var(--line);border-radius:28px;
  padding:18px 16px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden
}
.learn::before{
  content:"";position:absolute;inset:0 0 auto;height:10px;
  background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6),var(--c7),var(--c8))
}
.bigletters{font-size:96px;line-height:1.05;font-weight:800;letter-spacing:2px;margin:10px 0 2px}
.bignum{font-size:112px;line-height:1;font-weight:800;margin:8px 0 0}
.art{width:180px;height:180px;margin:6px auto 0}
.art svg{width:100%;height:100%;display:block}
.wordline{font-size:30px;font-weight:800;margin-top:4px}
.navrow{display:flex;align-items:center;gap:12px;margin-top:14px}
.navbtn{
  flex:1;border:0;border-radius:18px;padding:16px;font-family:inherit;font-size:24px;font-weight:800;
  background:linear-gradient(135deg,#a9d9ff,#6fb4ff);color:#123;cursor:pointer;box-shadow:0 5px 0 rgba(42,47,69,.18)
}
.navbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(42,47,69,.18)}
.navbtn.say{flex:0 0 84px;background:linear-gradient(135deg,#ffe08a,#ffc93d)}
.jump{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}
.jump.nums{grid-template-columns:repeat(5,1fr)}

/* ---------- tap a letter (one button per letter, it plays the sound) ---------- */
.t7{background:linear-gradient(135deg,#ffb3b3,#ff6b6b)}
.abcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (min-width:520px){ .abcgrid{grid-template-columns:repeat(6,1fr)} }
.abcbtn{
  position:relative;aspect-ratio:1/1;border:none;border-radius:20px;cursor:pointer;
  font-family:inherit;font-size:clamp(28px,9vw,40px);font-weight:800;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.2);
  box-shadow:0 5px 0 rgba(42,47,69,.22);transition:transform .08s;
}
.abcbtn:active,.abcbtn.playing{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 rgba(42,47,69,.22)}
.abcbtn.playing{outline:4px solid #fff;outline-offset:-9px}
.abcbtn .mark{position:absolute;top:4px;right:8px;font-size:15px;text-shadow:none}
.abcbtn.rec{animation:recpulse .7s infinite alternate;background:#e5384f !important}
@keyframes recpulse{from{filter:brightness(1)}to{filter:brightness(1.4)}}

/* ---------- kids mode: student picker, topics, pictures ---------- */
.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.whobtn{border:0;border-radius:26px;padding:22px 10px;font-family:inherit;font-weight:800;font-size:26px;color:#26304a;
  cursor:pointer;box-shadow:0 6px 0 rgba(42,47,69,.16);display:flex;flex-direction:column;align-items:center;gap:6px}
.whobtn .big{font-size:76px;line-height:1}
.whobtn .en{font-size:15px;opacity:.7}
.whobtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(42,47,69,.16)}
.hello{display:flex;align-items:center;gap:10px;justify-content:space-between}
.hello h1{font-size:24px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:360px){ .tgrid{grid-template-columns:repeat(2,1fr)} }
.ttile{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:10px 4px 8px;cursor:pointer;
  font-family:inherit;color:var(--ink);font-weight:800;font-size:15px;box-shadow:0 4px 0 rgba(42,47,69,.10);
  display:flex;flex-direction:column;align-items:center;gap:2px}
.ttile .emo{font-size:38px;line-height:1.1}
.ttile .u{font-size:11.5px;color:var(--muted);font-weight:700}
.ttile:active{transform:translateY(3px)}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.blob{display:block;width:78%;aspect-ratio:1/1;margin:0 auto;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.wpic{display:grid;place-items:center;width:100%;height:100%}
.wpic svg{width:100%;height:100%;display:block}
.learnpic{width:190px;height:190px;margin:8px auto 0;display:grid;place-items:center}
.learnpic .emo{font-size:150px}
.ru{font-size:16px;color:var(--muted);font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.thumbs button{border:3px solid var(--line);background:var(--card);border-radius:16px;aspect-ratio:1/1;cursor:pointer;padding:6px;display:grid;place-items:center}
.thumbs button .emo{font-size:34px}
.thumbs button.on{border-color:#f0bf1d;background:#fff6cf}
.teacherbar{background:#2a2f45;color:#fff;border-radius:18px;padding:12px 14px}
.teacherbar a,.teacherbar button{color:#fff}
.teacherbar .chip{background:#3b4260;border-color:#4b5378;color:#fff;text-decoration:none;display:inline-block}

/* listen-and-find quiz */
.qtop{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0 12px}
.listenbtn{border:0;border-radius:50%;width:96px;height:96px;font-size:46px;cursor:pointer;
  background:linear-gradient(135deg,#ffe08a,#ffc93d);box-shadow:0 6px 0 rgba(42,47,69,.18)}
.listenbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(42,47,69,.18)}
.qprompt{width:150px;height:150px;margin:0 auto 10px}
.qprompt svg{width:100%;height:100%}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qbtn{position:relative;border:4px solid var(--line);background:var(--card);border-radius:22px;aspect-ratio:1/1;cursor:pointer;
  display:grid;place-items:center;padding:10px;font-family:inherit;color:var(--ink);box-shadow:0 4px 0 rgba(42,47,69,.12)}
.qbtn .emo{font-size:clamp(56px,18vw,90px)}
.qbtn .face{font-size:clamp(48px,15vw,72px);font-weight:800}
.qbtn.good{border-color:#2fa557;background:#e3f9ea;animation:pop .32s ease}
.qbtn.bad{border-color:#e05252;background:#ffecec;animation:shake .34s ease}
.qbtn.dim{opacity:.35}

/* memory cards */
.mcard.back{background:linear-gradient(135deg,#a9d9ff,#6fb4ff);border-color:#6fb4ff}
.mcard.back .wpic,.mcard.back .blob{visibility:hidden}
.board.fit .mcard .blob{width:calc(var(--cs) * .66)}
.mcard.back::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:calc(var(--cs,80px) * .45)}
.board.fit .mcard .emo{font-size:calc(var(--cs) * .52)}
.board.fit .mcard .wpic{width:calc(var(--cs) * .78);height:calc(var(--cs) * .78)}
.mcard .face.wordtxt{font-size:calc(var(--cs,90px) * .2);word-break:break-word;text-align:center}

/* my stars */
.histrow{display:flex;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:2px dashed var(--line);font-size:15px}
.histrow:last-child{border-bottom:0}

/* grids sized to the screen by fitGrid(): --cs is the button size */
.wrap:has(.fitgrid){padding-bottom:6px}
.fitgrid{justify-content:center}
.abcgrid.fitgrid .abcbtn{font-size:calc(var(--cs) * .38);border-radius:calc(var(--cs) * .22)}
.abcgrid.fitgrid .abcbtn .mark{font-size:calc(var(--cs) * .18)}
.qgrid.fitgrid .qbtn{aspect-ratio:auto;height:var(--cs);padding:6px;border-radius:calc(var(--cs) * .14)}
.qgrid.fitgrid .qbtn .emo{font-size:calc(var(--cs) * .56)}
.qgrid.fitgrid .qbtn .face{font-size:calc(var(--cs) * .4)}
.qgrid.fitgrid .qbtn .wpic{width:calc(var(--cs) * .8);height:calc(var(--cs) * .8)}
.qgrid.fitgrid .qbtn .blob{width:calc(var(--cs) * .7)}
.qbtn.found{border-color:#2fa557;background:#e3f9ea}
.qbtn .lab2{position:absolute;bottom:4px;left:0;right:0;font-size:13px;font-weight:800;color:#2f9b53}

/* homework */
.hwcard{background:linear-gradient(135deg,#fff3c4,#ffe08a);border:3px solid #f0bf1d;border-radius:22px;padding:12px 12px 10px}
.hwhead{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800}
.hwitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;border-radius:16px;padding:10px 12px;margin-top:8px;
  font-family:inherit;font-weight:800;font-size:17px;color:var(--ink);cursor:pointer;text-align:left;box-shadow:0 3px 0 rgba(42,47,69,.10)}
.hwitem .emo{font-size:28px}
.hwitem .sub{display:block;font-size:13px;color:var(--muted)}
.hwitem .st{margin-left:auto;font-size:24px}
.hwitem.done{opacity:.65}
.hwnote{margin:8px 2px 0;font-size:14px;font-weight:800;color:#7a5a00}
.tile.locked,.ttile.locked{opacity:.45;filter:grayscale(.7)}
.tile .lock{margin-left:auto;font-size:22px}

/* yes / no */
.ynpic{width:min(44vw,190px);height:min(44vw,190px);margin:0 auto}
.ynpic .emo{font-size:min(36vw,150px)}
.ynq{display:flex;align-items:center;justify-content:center;gap:10px;font-size:23px;font-weight:800;margin:8px 0 14px;text-align:center}
.listenbtn.small{width:58px;height:58px;font-size:26px;flex:none}
.ynrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ynbtn{border:4px solid var(--line);background:#fff;border-radius:24px;padding:14px 6px;font-family:inherit;font-size:46px;cursor:pointer;
  box-shadow:0 5px 0 rgba(42,47,69,.14);color:var(--ink)}
.ynbtn span{display:block;font-size:20px;font-weight:800}
.ynbtn.good{border-color:#2fa557;background:#e3f9ea;animation:pop .32s ease}
.ynbtn.bad{border-color:#e05252;background:#ffecec;animation:shake .34s ease}

/* build the word */
.sppic{width:130px;height:130px;margin:0 auto}
.sppic .emo{font-size:108px}
.slots{display:flex;justify-content:center;gap:6px;margin:12px 0 16px}
.slot{width:var(--t);height:calc(var(--t) * 1.15);border-bottom:4px solid #5b8cff;font-size:calc(var(--t) * .62);font-weight:800;display:grid;place-items:center}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.ltile{width:var(--t);height:var(--t);border-radius:14px;border:3px solid var(--line);background:#fff;font-family:inherit;font-weight:800;
  font-size:calc(var(--t) * .55);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(42,47,69,.12)}
.ltile.used{visibility:hidden}
.ltile.bad{border-color:#e05252;background:#ffecec;animation:shake .34s ease}

/* find everything with… */
.hunthead{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 12px}
.bigl{font-size:58px;font-weight:800;line-height:1}

/* join the letters */
.joinwrap{position:relative}
.jgrid{display:grid;gap:12px}
.jbtn{border-radius:50%;aspect-ratio:1/1;border:4px solid var(--line);background:#fff;font-family:inherit;font-weight:800;color:var(--ink);
  font-size:calc(var(--cs) * .42);cursor:pointer;box-shadow:0 3px 0 rgba(42,47,69,.12);position:relative;z-index:1}
.jbtn.on{background:#ffd93d;border-color:#f0bf1d}
.jbtn.bad{border-color:#e05252;background:#ffecec;animation:shake .34s ease}
.joinsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.joinends{display:flex;justify-content:space-between;font-size:34px;margin:0 6px 6px}
.jump button{
  border:3px solid var(--line);background:var(--card);border-radius:14px;padding:9px 0;
  font-family:inherit;font-size:18px;font-weight:800;color:var(--ink);cursor:pointer
}
.jump button.on{background:#ffd93d;border-color:#f0bf1d}

/* ---------- matching game ---------- */
.gamehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.gamehead .muted{white-space:nowrap}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.dot.on{background:#4ecb71;border-color:#2fa557}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.mcard{
  position:relative;border:4px solid var(--line);background:var(--card);border-radius:20px;
  min-height:74px;display:grid;place-items:center;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 0 rgba(42,47,69,.12);padding:8px;color:var(--ink);
  transition:transform .1s ease, background .15s ease, border-color .15s ease;
}
.mcard .face{font-size:42px;font-weight:800;line-height:1}
.mcard .face.word{font-size:26px}
.mcard .pic{width:100%;max-width:104px;aspect-ratio:1/1}
.mcard .pic svg{width:100%;height:100%;display:block}
.mcard .lab{display:block;font-size:17px;font-weight:800;height:0;opacity:0;transition:.25s ease}
.mcard.good .lab,.mcard.done .lab{height:auto;opacity:1;margin-top:4px}
.mcard:active{transform:translateY(2px)}
.mcard.pick{border-color:#5b8cff;background:#eaf1ff;transform:translateY(-2px) scale(1.03)}
.mcard.good{border-color:#2fa557;background:#e3f9ea;animation:pop .32s ease}
.mcard.bad{border-color:#e05252;background:#ffecec;animation:shake .34s ease}
.mcard.done{opacity:.72;pointer-events:none;box-shadow:none;border-color:#bfe8cd;background:#f2fbf5}
.mcard .tick{position:absolute;top:-10px;right:-8px;font-size:24px;opacity:0;transform:scale(.4)}
/* board sized to the screen by fitBoard(): --cs is the card size in px */
.board.fit{gap:8px}
.wrap:has(.board.fit){padding-bottom:6px}
.board.fit .mcard{min-height:0;padding:4px;border-width:3px;border-radius:calc(var(--cs) * .16);overflow:hidden;align-content:center}
.board.fit .mcard .face{font-size:calc(var(--cs) * .40)}
.board.fit .mcard .face.word{font-size:calc(var(--cs) * .22)}
.board.fit .mcard .pic{width:calc(var(--cs) * .66);max-width:none;margin:0 auto}
.board.fit .mcard .lab{font-size:calc(var(--cs) * .15)}
.board.fit .mcard.good .pic,.board.fit .mcard.done .pic{width:calc(var(--cs) * .48)}
.board.fit .mcard .tick{top:-2px;right:0;font-size:calc(var(--cs) * .2)}
.mcard.good .tick,.mcard.done .tick{opacity:1;transform:scale(1);transition:.25s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- win screen ---------- */
.win{text-align:center;padding:10px 4px}
.stars{font-size:52px;letter-spacing:6px;margin:6px 0}
.winword{font-size:32px;font-weight:800;margin:6px 0}

/* ---------- confetti ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.conf{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}

/* things to count, for the number games */
const COUNT_COLORS = ["#ff6b6b","#ffa63d","#ffd93d","#4ecb71","#3ec5e0","#5b8cff","#a878ff","#ff7ac0"];

/* how many things go in one row, so the group looks tidy (index = the number) */
const PER_ROW = [0, 1,2,3,2,3, 3,4,4,3,5, 4,4,5,5,5, 4,5,5,5,5];

function countArt(n){
  const per = PER_ROW[n] || 5;
  const rows = Math.ceil(n/per);
  const pitchX = 92/per, pitchY = 92/rows;
  const size = Math.min(pitchX, pitchY) * 0.40;
  let out = `<svg viewBox="0 0 100 100">`;
  for(let r = 0, i = 0; r < rows; r++){
    const inRow = Math.min(per, n - r*per);
    for(let c = 0; c < inRow; c++, i++){
      const x = 50 + (c - (inRow-1)/2) * pitchX;
      const y = 50 + (r - (rows-1)/2) * pitchY;
      const col = COUNT_COLORS[i % COUNT_COLORS.length];
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size.toFixed(1)}" fill="${col}"/>`
           + `<circle cx="${(x-size*0.3).toFixed(1)}" cy="${(y-size*0.35).toFixed(1)}" r="${(size*0.28).toFixed(1)}" fill="#fff" opacity=".55"/>`;
    }
  }
  return out + `</svg>`;
}

  const i = letter ? Math.max(0, w.toLowerCase().indexOf(letter.toLowerCase())) : 0;
  return `${esc(w.slice(0, i))}<span style="color:#e5384f">${esc(w[i])}</span>${esc(w.slice(i + 1))}`;
};

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1600);
}

/* ---------- sounds made by the browser, no files needed ---------- */
let actx = null;
function tone(freqs, dur, type){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      const t0 = actx.currentTime + i*dur*0.8;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    });
  }catch(e){}
}
const soundGood  = () => tone([660, 880], 0.16);
const soundWrong = () => tone([200], 0.18, "triangle");
const soundWin   = () => tone([523, 659, 784, 1047], 0.2);

/* ---------- the voice ---------- */

  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = 0.85; u.pitch = 1.1;
    const v = speechSynthesis.getVoices().find(v => /en[-_](GB|US|AU)/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- real recordings (sounds/ folder, from Wikimedia Commons) ----------
   say("A", "apple") plays sounds/names/a.mp3 then sounds/words/apple.mp3.
   A letter means its NAME; a picture word or number word means that word.
   Anything without a recording, or a file that fails to load, is read by
   the browser voice instead. Credits: credits.html                        */
function clipFor(t){
  if(/^[A-Z]$/.test(t)) return "sounds/names/" + t.toLowerCase() + ".mp3";
  if((window.VOCAB_AUDIO || []).includes(t)) return "sounds/vocab/" + String(t).toLowerCase().replace(/ /g, "-") + ".mp3";
  const w = String(t).toLowerCase();
  if(LETTERS.some(L => L.word === w)) return "sounds/words/" + w.replace(/ /g, "-") + ".mp3";
  const n = NUMBER_WORDS.indexOf(w);
  if(n >= 1 && n <= 20) return "sounds/numbers/" + w + ".mp3";
  return null;
}
let clipPlayer = null, clipRun = 0;
function say(...parts){
  if(!S.speak) return;
  const run = ++clipRun;
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ if(clipPlayer) clipPlayer.pause(); }catch(e){}
  const next = i => {
    if(run !== clipRun || i >= parts.length) return;
    const src = clipFor(parts[i]);
    if(!src){ speak(parts.slice(i).join(". ")); return; }
    const a = new Audio(src);
    clipPlayer = a;
    a.onended = () => setTimeout(() => next(i + 1), 120);
    a.onerror = () => { if(run === clipRun) speak(parts.slice(i).join(". ")); };
    const pr = a.play();
    if(pr && pr.catch) pr.catch(() => { if(run === clipRun) speak(parts.slice(i).join(". ")); });
  };
  next(0);
}

function confetti(){

}

/* ==========================================================================
   TAP A LETTER — 26 buttons, a tap plays the letter's sound

   WHERE THE SOUNDS COME FROM (first one found wins)
     1. A sound the teacher recorded on THIS device (Teacher: record sounds).
     2. A letter-sound file on the website, e.g. sounds/phonics/a.mp3.
        List a letter in SITE_SOUNDS once its file is there.
     3. Nothing recorded yet: the recording of the picture word plays
        ("apple"), so the child still hears the sound at the start.
   "Letter name" mode plays the recorded letter names: A, B, C.
   ========================================================================== */

const SITE_SOUNDS = "";      /* e.g. "abcdefghijklmnopqrstuvwxyz" once all files are in sounds/phonics/ */
const SITE_SOUND_EXT = "mp3";
const ABC_COLORS = ["#ff6b6b","#ffa63d","#f2b705","#4ecb71","#3ec5e0","#5b8cff","#a878ff","#ff7ac0"];

/* --- recordings kept in this browser (IndexedDB) --- */
const recDB = {
  open(){
    if(this._p) return this._p;
    this._p = new Promise((ok, no) => {
      try{
        const r = indexedDB.open("abc-sounds", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("rec");
        r.onsuccess = () => ok(r.result);
        r.onerror = () => no(r.error);
      }catch(e){ no(e); }
    });
    return this._p;
  },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((ok, no) => {
      const tx = db.transaction("rec", mode), st = tx.objectStore("rec");
      const req = fn(st);
      tx.oncomplete = () => ok(req && req.result);
      tx.onerror = () => no(tx.error);
    });
  },
  get(k){ return this.run("readonly", st => st.get(k)).catch(() => null); },
  put(k, v){ return this.run("readwrite", st => st.put(v, k)); },
  async keys(){ try{ return await this.run("readonly", st => st.getAllKeys()); }catch(e){ return []; } }
};

let player = null;
function playBlobOrUrl(src){
  try{ if(player){ player.pause(); } }catch(e){}
  player = new Audio(src);
  return player.play();
}

async function playLetterSound(L){
  const k = L.l.toLowerCase();
  if(S.abcMode === "name"){ say(L.l); return; }
  const mine = await recDB.get(k);
  if(mine){ try{ speechSynthesis.cancel(); }catch(e){} playBlobOrUrl(URL.createObjectURL(mine)); return; }
  if(SITE_SOUNDS.includes(k)){ playBlobOrUrl("sounds/phonics/" + k + "." + SITE_SOUND_EXT).catch(() => say(L.word)); return; }
  say(L.word);
}

async function toggleRecord(btn, L){
  if(recorder && recorder.state === "recording"){ recorder.stop(); return; }
  try{
    micStream = micStream || await navigator.mediaDevices.getUserMedia({ audio:true });
  }catch(e){ toast("The microphone is blocked — allow it in the browser"); return; }
  const chunks = [];
  recorder = new MediaRecorder(micStream);
  recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    clearTimeout(recTimer);
    btn.classList.remove("rec");
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    recorder = null;
    await recDB.put(L.l.toLowerCase(), blob);
    playBlobOrUrl(URL.createObjectURL(blob));
    if(!btn.querySelector(".mark")) btn.insertAdjacentHTML("beforeend", '<span class="mark">✅</span>');
    const n = (await recDB.keys()).length;
    const c = document.getElementById("recCount"); if(c) c.textContent = n;
    const z = $("[data-zip]"); if(z) z.disabled = false;
  };
  try{ speechSynthesis.cancel(); }catch(e){}
  recorder.start();
  btn.classList.add("rec");
  recTimer = setTimeout(() => { if(recorder && recorder.state === "recording") recorder.stop(); }, 2000);
}

function extFor(type){
  if(/mp4|m4a|aac/.test(type)) return "m4a";
  if(/ogg/.test(type)) return "ogg";
  if(/mpeg|mp3/.test(type)) return "mp3";
  return "webm";
}

async function downloadRecordings(){
  const keys = await recDB.keys();
  if(!keys.length) return;
  toast("Packing the sounds…");
  if(!window.JSZip){
    await new Promise((ok, no) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
      s.onload = ok; s.onerror = no; document.head.appendChild(s);
    }).catch(() => null);
  }
  if(!window.JSZip){ toast("Could not pack the files — check the internet"); return; }
  const zip = new JSZip();
  for(const k of keys){ const b = await recDB.get(k); if(b) zip.file(k + "." + extFor(b.type), b); }
  const out = await zip.generateAsync({ type:"blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(out); a.download = "letter-sounds.zip";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ==========================================================================
   CHOOSING THE LETTERS OR NUMBERS
   ========================================================================== */

function poolFor(kind){
  if(kind === "letters"){
    const a = clamp(S.from, 0, 25), b = clamp(S.to, 0, 25);
    return LETTERS.slice(Math.min(a,b), Math.max(a,b)+1);
  }
  const a = clamp(S.nFrom, 1, MAX_NUMBER), b = clamp(S.nTo, 1, MAX_NUMBER);
  const out = [];
  for(let n = Math.min(a,b); n <= Math.max(a,b); n++) out.push({ n });
  return out;
}

function setupScreen(gameId){
  const G = GAMES[gameId];
  const letters = G.kind === "letters";
  const opts = letters
    ? LETTERS.map((x,i) => ({ v:i, label:x.l }))
    : Array.from({length:MAX_NUMBER}, (_,i) => ({ v:i+1, label:String(i+1) }));
  const from = letters ? S.from : S.nFrom;
  const to   = letters ? S.to   : S.nTo;
  const presets = letters
    ? [["A – E",0,4],["A – H",0,7],["A – M",0,12],["A – Z",0,25]]
    : [["1 – 5",1,5],["1 – 10",1,10],["1 – 12",1,12],["1 – 20",1,20]];

  app.innerHTML = topBar(G.title) + `
  <div class="stack">
    <div class="card center">
      <h2>${G.what}</h2>
      <p class="muted small" style="margin:6px 0 14px">В игре будут только выбранные.</p>
      <div class="chips" style="margin-bottom:14px">
        ${presets.map(([lab,a,b]) =>
          `<button class="chip ${from===a&&to===b?"on":""}" data-preset="${a},${b}">${lab}</button>`).join("")}
      </div>
      <div class="pickrow">
        <span class="muted">от</span>
        <select data-from>${opts.map(o => `<option value="${o.v}" ${o.v===from?"selected":""}>${o.label}</option>`).join("")}</select>
        <span class="muted">до</span>
        <select data-to>${opts.map(o => `<option value="${o.v}" ${o.v===to?"selected":""}>${o.label}</option>`).join("")}</select>
      </div>
      <div class="preview" id="prev" style="margin-top:14px"></div>
    </div>
    <button class="btn go big" data-start>▶ Играть!</button>
  </div>`;
  wireTop();

  const drawPreview = () => {
    const pool = poolFor(G.kind);
    $("#prev").innerHTML = pool.map(it =>
      `<span>${letters ? it.l + it.l.toLowerCase() : it.n}</span>`).join("");
  };
  const setRange = (a, b) => {
    if(letters){ S.from = a; S.to = b; } else { S.nFrom = a; S.nTo = b; }
    save();
  };

  $$("[data-preset]").forEach(b => b.onclick = () => {
    const [a,c] = b.dataset.preset.split(",").map(Number);
    setRange(a, c); setupScreen(gameId);
  });
  $("[data-from]").onchange = e => { setRange(+e.target.value, to); setupScreen(gameId); };
  $("[data-to]").onchange   = e => { setRange(from, +e.target.value); setupScreen(gameId); };
  $("[data-start]").onclick = () => go(() => launchRangeGame(gameId));
  drawPreview();
}

/* ==========================================================================
   THE MATCHING GAME
   ========================================================================== */

/* split the whole range into even rounds of at most MAX_PAIRS */
function makeRounds(pool){
  const all = shuffle(pool);
  const n = Math.max(1, Math.ceil(all.length / MAX_PAIRS));
  const per = Math.ceil(all.length / n);
  const out = [];
  for(let i = 0; i < all.length; i += per) out.push(all.slice(i, i + per));
  return out;
}

function playRound(gameId, game){
  const G = GAMES[gameId];
  if(!game){
    const rounds = makeRounds(G.kind === "topic" ? curTopic.words : poolFor(G.kind));
    game = { rounds, at:0, mistakes:0, total:rounds.reduce((t, r) => t + r.length, 0) };
  }
  const round = game.rounds[game.at];
  const size = round.length;

  const key = it => G.key ? G.key(it) : G.kind === "letters" ? it.l : String(it.n);
  const leftCards  = shuffle(round).map(it => ({ id:key(it), it, side:"L", ...G.left(it) }));
  const rightCards = shuffle(round).map(it => ({ id:key(it), it, side:"R", ...G.right(it) }));

  let matched = 0, mistakes = 0, pickL = null, pickR = null, busy = false;

  const cardHtml = (c, i) =>
    `<button class="mcard" data-side="${c.side}" data-i="${i}" data-id="${esc(c.id)}">
       ${c.html}<span class="tick">⭐</span>
     </button>`;

  app.innerHTML = topBar(G.title) + `
  <div class="stack">
    <div class="gamehead">
      <div class="dots" id="dots">${round.map(() => `<span class="dot"></span>`).join("")}</div>
      <span class="muted small" id="count">0 / ${size}</span>
      ${game.rounds.length > 1 ? `<span class="muted small">Раунд ${game.at + 1} из ${game.rounds.length}</span>` : ""}
      <button class="iconbtn" data-again aria-label="New cards" title="New cards">🔀</button>
    </div>
    <div class="board">
      ${round.map((_, i) => cardHtml(leftCards[i], i) + cardHtml(rightCards[i], i)).join("")}
    </div>
  </div>`;
  wireTop();
  $("[data-again]").onclick = () => playRound(gameId);

  fitBoard();
  window.onresize = () => { if($(".board")) fitBoard(); };

  const cardsEl = $$(".mcard");
  const elOf = (side, i) => cardsEl.find(e => e.dataset.side === side && +e.dataset.i === i);

  function clearPick(){
    if(pickL !== null) elOf("L", pickL).classList.remove("pick");
    if(pickR !== null) elOf("R", pickR).classList.remove("pick");
    pickL = pickR = null;
  }

  function check(){
    if(pickL === null || pickR === null) return;
    const a = elOf("L", pickL), b = elOf("R", pickR);
    busy = true;
    if(a.dataset.id === b.dataset.id){
      const item = leftCards[pickL].it;
      a.classList.remove("pick"); b.classList.remove("pick");
      a.classList.add("good"); b.classList.add("good");
      soundGood(); say(...G.cheer(item));
      matched++;
      const dots = $$("#dots .dot");
      if(dots[matched-1]) dots[matched-1].classList.add("on");
      $("#count").textContent = matched + " / " + size;
      pickL = pickR = null;
      setTimeout(() => {
        a.classList.remove("good"); b.classList.remove("good");
        a.classList.add("done");   b.classList.add("done");
        busy = false;
        if(matched === size) setTimeout(() => {
          game.mistakes += mistakes;
          if(game.at + 1 < game.rounds.length){
            game.at++; soundWin(); speak("Next round!"); toast("⭐ Следующий раунд!");
            playRound(gameId, game);
          }else{
            const stars = game.mistakes === 0 ? 3 : game.mistakes <= 2 ? 2 : 1;
            finish({ title:G.title, game:gameId, topic:G.kind === "topic" ? curTopic.id : rangeLabel(G.kind),
              right:game.total, total:game.total, stars,
              line:`${game.total} пар` + (game.mistakes ? ` · ошибок: ${game.mistakes}` : " · без ошибок!"),
              again:() => playRound(gameId),
              change: G.kind === "topic" ? null : () => { stack.pop(); setupScreen(gameId); },
              changeLabel: G.kind === "letters" ? "✏️ Другие буквы" : "✏️ Другие цифры" });
          }
        }, 420);
      }, 520);
    }else{
      mistakes++;
      a.classList.add("bad"); b.classList.add("bad");
      soundWrong();
      setTimeout(() => {
        a.classList.remove("bad","pick"); b.classList.remove("bad","pick");
        pickL = pickR = null; busy = false;
      }, 460);
    }
  }

  cardsEl.forEach(el => el.onclick = () => {
    if(busy || el.classList.contains("done")) return;
    const side = el.dataset.side, i = +el.dataset.i;
    if(side === "L"){
      if(pickL === i){ el.classList.remove("pick"); pickL = null; return; }
      if(pickL !== null) elOf("L", pickL).classList.remove("pick");
      pickL = i;
    }else{
      if(pickR === i){ el.classList.remove("pick"); pickR = null; return; }
      if(pickR !== null) elOf("R", pickR).classList.remove("pick");
      pickR = i;
    }
    el.classList.add("pick");
    tone([520], 0.06);
    const c = (side === "L" ? leftCards : rightCards)[i];
    if(pickL === null || pickR === null) say(c.say);
    check();
  });
}

/* size the cards so the whole board fits on the screen without scrolling */
function fitBoard(){
  const board = $(".board"); if(!board) return;
  const n = board.children.length, gap = 8;
  const W = board.clientWidth;
  const H = Math.max(160, window.innerHeight - board.getBoundingClientRect().top - 14);
  let best = null;
  for(const cols of [2, 4, 6]){
    const rows = Math.ceil(n / cols);
    const cw = (W - gap*(cols-1)) / cols, ch = (H - gap*(rows-1)) / rows;
    const size = Math.min(cw, ch);
    if(!best || size > best.size) best = { cols, size, ch };
  }
  board.classList.add("fit");
  board.style.gridTemplateColumns = `repeat(${best.cols}, 1fr)`;
  board.style.gridAutoRows = Math.min(best.ch, 150) + "px";
  board.style.setProperty("--cs", Math.min(best.size, 150) + "px");
}

  return Math.min(S.nFrom, S.nTo) + "–" + Math.max(S.nFrom, S.nTo);
}

/* ==========================================================================
   SCORES — saved on this device, and sent to the teacher's Google Sheet
   when SCORES_URL is set in content/scores-config.js
   ========================================================================== */

function allScores(){ try{ return JSON.parse(localStorage.getItem("abcScores") || "[]"); }catch(e){ return []; } }
function myScores(){ return S.student ? allScores().filter(r => r.student === S.student) : []; }
function recordScore(r){
  if(!S.student) return;
  const row = Object.assign({ t:new Date().toISOString(), student:S.student, id:Date.now() + "-" + Math.random().toString(36).slice(2, 7) }, r);
  const all = allScores(); all.push(row);
  try{ localStorage.setItem("abcScores", JSON.stringify(all.slice(-3000))); }catch(e){}
  queueAdd(row); sendQueue();
}

/* results waiting to reach the teacher's Google Sheet (kept until Google says "ok") */
function queueGet(){ try{ return JSON.parse(localStorage.getItem("abcQueue") || "[]"); }catch(e){ return []; } }
function queueSet(q){ try{ localStorage.setItem("abcQueue", JSON.stringify(q.slice(-500))); }catch(e){} }
function queueAdd(row){ const q = queueGet(); q.push(row); queueSet(q); }
let sending = false;
async function sendQueue(){
  if(!window.SCORES_URL || sending) return;
  sending = true;
  try{
    for(const row of queueGet()){
      const res = await fetch(window.SCORES_URL, { method:"POST", headers:{ "Content-Type":"text/plain" }, body:JSON.stringify(row) });
      const data = await res.json();
      if(!data.ok && data.error !== "unknown student") break;
      queueSet(queueGet().filter(x => x.id !== row.id));
    }
  }catch(e){ /* offline or blocked: try again next time */ }
  sending = false;
}
window.addEventListener("online", sendQueue);

function spellWords(t){ return t.words.filter(w => /^[a-z]{2,8}$/i.test(w.w)); }

/* open one game for the current topic (curTopic) */
function launchTopicGame(id){
  if(id === "learn"){ topicIdx = 0; learnSeen = new Set(); learnTopic(); say(curTopic.words[0].w); return; }
  if(id === "listen") return startTopicQuiz();

}
/* open one letter or number game for the range already chosen */
function launchRangeGame(id){
  const G = GAMES[id];
  if(G.type === "quiz") return startQuiz(id);
  if(G.start) return G.start();
  return playRound(id);
}

function startTopicQuiz(){
  quiz({ id:"listen", title:"Слушай и найди", topic:curTopic.id,
    items:curTopic.words, key:w => w.w, say:w => [w.w], choice:w => wordPic(w),
    again:() => startTopicQuiz() });
}

function startQuiz(gameId){
  const G = GAMES[gameId];
  quiz({ id:gameId, title:G.title, topic:rangeLabel(G.kind),
    items:poolFor(G.kind).filter(it => !(gameId === "firstLetter" && it.l === "X")),
    key:it => G.kind === "letters" ? it.l : String(it.n),
    say:G.say, prompt:G.prompt, choice:G.choice,
    again:() => startQuiz(gameId),
    change:() => { stack.pop(); setupScreen(gameId); },
    changeLabel: G.kind === "letters" ? "✏️ Другие буквы" : "✏️ Другие цифры" });
}

function quiz(o){
  const order = shuffle(o.items);
  const nChoices = Math.min(4, o.items.length);
  let at = 0, right = 0, missed = false, busy = false;

  function round(){
    const it = order[at];
    const others = shuffle(o.items.filter(x => o.key(x) !== o.key(it))).slice(0, nChoices - 1);
    const choices = shuffle([it, ...others]);
    missed = false; busy = false;
    app.innerHTML = topBar(o.title) + `
    <div class="stack">
      <div class="gamehead">
        <div class="dots">${order.map((_, i) => `<span class="dot ${i < at ? "on" : ""}"></span>`).join("")}</div>
        <span class="muted small">${at + 1} / ${order.length}</span>
      </div>
      <div class="qtop"><button class="listenbtn" data-listen aria-label="Слушать">🔊</button></div>
      ${o.prompt ? o.prompt(it) : ""}
      <div class="qgrid">${choices.map((c, i) => `<button class="qbtn" data-i="${i}">${o.choice(c)}</button>`).join("")}</div>
    </div>`;
    wireTop();
    onFit(() => fitGrid($(".qgrid"), choices.length, { cols:[2, 4], max:210, min:70 }));
    const hear = () => say(...o.say(it));
    $("[data-listen]").onclick = hear;
    setTimeout(hear, 250);
    $$(".qbtn").forEach(b => b.onclick = () => {
      if(busy) return;
      const c = choices[+b.dataset.i];
      if(o.key(c) === o.key(it)){
        busy = true; b.classList.add("good"); soundGood();
        if(!missed) right++;
        $$(".qbtn").forEach(x => { if(x !== b) x.classList.add("dim"); });
        setTimeout(() => { at++; at < order.length ? round() : done(); }, 750);
      }else{
        missed = true; b.classList.add("bad"); soundWrong();
        setTimeout(() => { b.classList.remove("bad"); hear(); }, 420);
      }
    });
  }
  function done(){
    const pct = right / order.length;
    finish({ title:o.title, game:o.id, topic:o.topic, right, total:order.length,
      stars: pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1,
      line:`Правильно с первого раза: ${right} из ${order.length}`,
      again:o.again, change:o.change, changeLabel:o.changeLabel });
  }
  round();
}

/* ==========================================================================
   MEMORY — find two cards with the same picture
   ========================================================================== */

function memoryGame(){
  const words = curTopic.words.length > 8 ? shuffle(curTopic.words).slice(0, 8) : curTopic.words;
  const cards = shuffle(words.concat(words).map((w, i) => ({ w, i })));
  let open = [], found = 0, flips = 0, busy = false;
  app.innerHTML = topBar("Найди пару") + `
  <div class="stack">
    <div class="gamehead">
      <div class="dots">${words.map(() => `<span class="dot"></span>`).join("")}</div>
      <span class="muted small" id="count">0 / ${words.length}</span>
    </div>
    <div class="board">${cards.map((c, i) => `<button class="mcard back" data-i="${i}">${wordPic(c.w)}</button>`).join("")}</div>
  </div>`;
  wireTop();
  fitBoard();
  window.onresize = () => { if($(".board")) fitBoard(); };
  const els = $$(".mcard");
  els.forEach(el => el.onclick = () => {
    const i = +el.dataset.i;
    if(busy || !el.classList.contains("back")) return;
    el.classList.remove("back"); say(cards[i].w.w);
    open.push(i);
    if(open.length < 2) return;
    flips++;
    const [a, b] = open; open = [];
    if(cards[a].w.w === cards[b].w.w){
      found++;
      setTimeout(() => {
        els[a].classList.add("done"); els[b].classList.add("done"); soundGood();
        const d = $$(".dots .dot")[found - 1]; if(d) d.classList.add("on");
        $("#count").textContent = found + " / " + words.length;
        if(found === words.length){
          const extra = flips - words.length;
          setTimeout(() => finish({ title:"Найди пару", game:"memory", topic:curTopic.id,
            right:words.length, total:words.length,
            stars: extra <= Math.ceil(words.length / 2) ? 3 : extra <= words.length + 1 ? 2 : 1,
            line:`Ходов: ${flips}`, again:() => memoryGame() }), 500);
        }
      }, 350);
    }else{
      busy = true;
      setTimeout(() => { els[a].classList.add("back"); els[b].classList.add("back"); busy = false; }, 950);
    }
  });
}

/* ==========================================================================
   FITTING — size a grid of buttons so the whole task fits on the screen.
   If the buttons would get smaller than "min", they keep "min" and the
   page scrolls instead.
   ========================================================================== */

function onFit(fn){ window.onresize = fn; fn(); }
function fitGrid(el, n, o){
  if(!el) return;
  const gap = o.gap || 10, W = el.clientWidth;
  const H = Math.max(120, window.innerHeight - el.getBoundingClientRect().top - (o.below || 14));
  let best = null;
  for(const c of o.cols){
    const r = Math.ceil(n / c);
    const size = Math.min((W - gap*(c-1)) / c, (H - gap*(r-1)) / r);
    if(!best || size > best.size) best = { c, size };
  }
  let size = Math.min(best.size, o.max || 999), cols = best.c;
  if(size < (o.min || 0)){
    cols = Math.max(o.cols[0], Math.floor((W + gap) / ((o.min || 0) + gap)));
    size = Math.min((W - gap*(cols-1)) / cols, o.max || 999);
  }
  el.classList.add("fitgrid");
  el.style.gap = gap + "px";
  el.style.gridTemplateColumns = `repeat(${cols}, ${Math.floor(size)}px)`;
  el.style.setProperty("--cs", Math.floor(size) + "px");
}

/* ==========================================================================
   HOMEWORK — set by the teacher on teacher.html, kept in the Google Sheet.
   While some homework is not done, the other games are locked 🔒.
   A task counts as done when this child finishes that game (same topic or
   letters) after the task was given.
   ========================================================================== */

const ALWAYS_OPEN = new Set(["tapLetters", "learnLetters", "learnNumbers", "myStars"]);
function hwKey(){ return "abcHW_" + S.student; }
function hwCached(){ try{ return JSON.parse(localStorage.getItem(hwKey()) || "null") || { items:[] }; }catch(e){ return { items:[] }; } }
async function loadHomework(){
  if(!window.SCORES_URL || !S.student) return false;
  try{
    const res = await fetch(window.SCORES_URL + "?action=homework&student=" + encodeURIComponent(S.student));
    const d = await res.json();
    if(!d.ok || !Array.isArray(d.items)) return false;
    const before = localStorage.getItem(hwKey());
    const now = JSON.stringify({ items:d.items });
    localStorage.setItem(hwKey(), now);
    return before !== now;
  }catch(e){ return false; }
}
function homework(){
  const mine = myScores();
  return hwCached().items.map(h => Object.assign({}, h, {
    done: !!h.done || mine.some(r => r.game === h.game && String(r.topic) === String(h.topic) && String(r.t) >= String(h.created))
  }));
}
function hwPending(){ return homework().some(h => !h.done); }
function hwTopicLabel(h){
  const g = gameInfo(h.game);
  if(g && g.kind === "topic") return topicName(h.topic);
  if(g && g.kind === "letters") return "Буквы " + h.topic;
  return "Цифры " + h.topic;
}
function homeworkCard(){
  const items = homework();
  if(!items.length) return "";
  const done = items.filter(h => h.done).length;
  const allDone = done === items.length;
  if(allDone && S.hwWasPending){ S.hwWasPending = false; save(); setTimeout(() => { confetti(); soundWin(); toast("🎉 Все игры открыты!"); }, 300); }
  if(!allDone && !S.hwWasPending){ S.hwWasPending = true; save(); }
  return `<div class="hwcard">
    <div class="hwhead"><span>📚 Домашнее задание</span><span>${done} / ${items.length}</span></div>
    ${items.map((h, i) => { const g = gameInfo(h.game) || { e:"🎮", ru:h.game };
      return `<button class="hwitem ${h.done ? "done" : ""}" data-hw="${i}"><span class="emo">${g.e}</span>
        <span>${esc(g.ru)}<span class="sub">${esc(hwTopicLabel(h))}</span></span><span class="st">${h.done ? "✅" : "▶️"}</span></button>`; }).join("")}
    <p class="hwnote">${allDone ? "🎉 Всё сделано! Все игры открыты." : "🔒 Сделай задание — и откроются все игры!"}</p>
  </div>`;
}
function wireHomework(){
  const items = homework();
  $$("[data-hw]").forEach(b => b.onclick = () => startTask(items[+b.dataset.hw]));
}
function isLocked(gameId, topicId){
  if(!hwPending()) return false;
  if(gameId === "learn") return false;
  return !homework().some(h => !h.done && h.game === gameId && (topicId == null || String(h.topic) === String(topicId)));
}
function markLocks(){
  if(!hwPending()) return;
  $$("[data-go]").forEach(b => {
    if(ALWAYS_OPEN.has(b.dataset.go)) return;
    b.classList.add("locked");
    b.insertAdjacentHTML("beforeend", '<span class="lock">🔒</span>');
  });
}
function lockedToast(){ soundWrong(); toast("🔒 Сначала сделай домашнее задание"); window.scrollTo({ top:0, behavior:"smooth" }); }
function startTask(h){
  const g = gameInfo(h.game);
  if(!g) return;
  if(g.kind === "topic"){
    const t = (window.TOPICS || []).find(x => x.id === h.topic);
    if(!t) return;
    curTopic = t;
    go(() => launchTopicGame(h.game));
    return;
  }
  const [a, b] = String(h.topic).split("–");
  if(g.kind === "letters"){
    S.from = Math.max(0, LETTERS.findIndex(L => L.l === a)); S.to = Math.max(0, LETTERS.findIndex(L => L.l === b));
  }else{ S.nFrom = +a || 1; S.nTo = +b || 10; }
  save();
  go(() => launchRangeGame(h.game));
}

/* ==========================================================================
   SMALL HELPERS FOR THE NEW GAMES
   ========================================================================== */

function dotsHead(total, at){
  return `<div class="gamehead">
    <div class="dots">${Array.from({ length:total }, (_, i) => `<span class="dot ${i < at ? "on" : ""}"></span>`).join("")}</div>
    <span class="muted small">${Math.min(at + 1, total)} / ${total}</span>
  </div>`;
}
function finishTopicGame(id, title, right, total, again, line){
  const pct = right / total;
  finish({ title, game:id, topic:curTopic.id, right, total, stars: pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1,
    line: line || `Правильно с первого раза: ${right} из ${total}`, again });
}
const PLURAL = new Set(["arms","legs","ears","socks","trousers","shorts","carrots","drinks"]);
const NO_ARTICLE = new Set(["rice","meat","bread","yogurt","fish"]);
function askLine(w){
  const x = w.w;
  if(curTopic && curTopic.id === "colours") return `Is it ${x}?`;
  if(curTopic && curTopic.id === "actions") return `${x[0].toUpperCase() + x.slice(1)}?`;
  if(x === "sea") return "Is it the sea?";
  if(PLURAL.has(x)) return `Are they ${x}?`;
  if(NO_ARTICLE.has(x)) return `Is it ${x}?`;
  return `Is it ${/^[aeiou]/i.test(x) ? "an" : "a"} ${x}?`;
}

/* ==========================================================================
   YES OR NO — "Is it a car?" (Family and Friends: point, ask and answer)
   ========================================================================== */

function yesNoGame(){
  const t = curTopic, items = shuffle(t.words).slice(0, 8);
  let at = 0, right = 0, missed = false, busy = false;
  function round(){
    const it = items[at];
    const yes = t.words.length < 2 || Math.random() < 0.5;
    const asked = yes ? it : shuffle(t.words.filter(w => w.w !== it.w))[0];
    missed = false; busy = false;
    app.innerHTML = topBar("Да или нет?") + `
    <div class="stack">
      ${dotsHead(items.length, at)}
      <div class="ynpic">${wordPic(it)}</div>
      <div class="ynq"><button class="listenbtn small" data-listen aria-label="Слушать">🔊</button><span>${esc(askLine(asked))}</span></div>
      <div class="ynrow">
        <button class="ynbtn" data-a="1">✅<span>Yes</span></button>
        <button class="ynbtn" data-a="0">❌<span>No</span></button>
      </div>
    </div>`;
    wireTop();
    const hear = () => say(asked.w);
    $("[data-listen]").onclick = hear;
    setTimeout(hear, 250);
    $$(".ynbtn").forEach(b => b.onclick = () => {
      if(busy) return;
      if((b.dataset.a === "1") === yes){
        busy = true; b.classList.add("good"); soundGood();
        if(!missed) right++;
        setTimeout(() => say(it.w), 250);
        setTimeout(() => { at++; at < items.length ? round() : finishTopicGame("yesno", "Да или нет?", right, items.length, () => yesNoGame()); }, 1100);
      }else{
        missed = true; b.classList.add("bad"); soundWrong();
        setTimeout(() => b.classList.remove("bad"), 420);
      }
    });
  }
  round();
}

/* ==========================================================================
   ODD ONE OUT — three from this topic, one from another
   ========================================================================== */

function oddGame(){
  const t = curTopic;
  const others = [];
  (window.TOPICS || []).forEach(x => { if(x.id !== t.id) x.words.forEach(w => { if(!t.words.some(y => y.w === w.w)) others.push(w); }); });
  const rounds = 6;
  let at = 0, right = 0, missed = false, busy = false;
  function round(){
    const odd = shuffle(others)[0];
    const choices = shuffle(shuffle(t.words).slice(0, 3).concat([odd]));
    missed = false; busy = false;
    app.innerHTML = topBar("Что лишнее?") + `
    <div class="stack">
      ${dotsHead(rounds, at)}
      <p class="center" style="font-size:20px;font-weight:800;margin:2px 0 10px">Какая картинка лишняя? 🤔</p>
      <div class="qgrid">${choices.map((c, i) => `<button class="qbtn" data-i="${i}">${wordPic(c)}</button>`).join("")}</div>
    </div>`;
    wireTop();
    onFit(() => fitGrid($(".qgrid"), 4, { cols:[2, 4], max:210, min:70 }));
    $$(".qbtn").forEach(b => b.onclick = () => {
      if(busy) return;
      const c = choices[+b.dataset.i];
      say(c.w);
      if(c === odd){
        busy = true; b.classList.add("good"); soundGood();
        if(!missed) right++;
        $$(".qbtn").forEach(x => { if(x !== b) x.classList.add("dim"); });
        setTimeout(() => { at++; at < rounds ? round() : finishTopicGame("odd", "Что лишнее?", right, rounds, () => oddGame()); }, 1000);
      }else{
        missed = true; b.classList.add("bad"); soundWrong();
        setTimeout(() => b.classList.remove("bad"), 420);
      }
    });
  }
  round();
}

/* ==========================================================================
   BUILD THE WORD — tap the letters in order (Family and Friends: Write)
   ========================================================================== */

function spellGame(){
  const items = shuffle(spellWords(curTopic)).slice(0, 6);
  let at = 0, right = 0;
  function round(){
    const it = items[at], word = it.w.toLowerCase();
    let tiles = shuffle(word.split(""));
    for(let k = 0; k < 5 && word.length > 1 && tiles.join("") === word; k++) tiles = shuffle(word.split(""));
    let typed = 0, missed = false, busy = false;
    const W = Math.min(app.clientWidth || 360, 560);
    const t = Math.max(34, Math.min(58, Math.floor((W - 8*(word.length - 1)) / word.length)));
    app.innerHTML = topBar("Собери слово") + `
    <div class="stack" style="--t:${t}px">
      ${dotsHead(items.length, at)}
      <div class="sppic">${wordPic(it)}</div>
      <div class="qtop" style="margin:6px 0 0"><button class="listenbtn small" data-listen aria-label="Слушать">🔊</button></div>
      <div class="slots">${word.split("").map(() => `<span class="slot"></span>`).join("")}</div>
      <div class="tiles">${tiles.map((ch, i) => `<button class="ltile" data-i="${i}">${esc(ch)}</button>`).join("")}</div>
    </div>`;
    wireTop();
    const hear = () => say(it.w);
    $("[data-listen]").onclick = hear;
    setTimeout(hear, 250);
    const slots = $$(".slot");
    $$(".ltile").forEach(b => b.onclick = () => {
      if(busy || b.classList.contains("used")) return;
      const ch = tiles[+b.dataset.i];
      if(ch === word[typed]){
        b.classList.add("used"); slots[typed].textContent = ch; typed++; tone([600 + typed*40], 0.07);
        if(typed === word.length){
          busy = true; soundGood(); say(it.w);
          if(!missed) right++;
          setTimeout(() => { at++; at < items.length ? round() : finishTopicGame("spell", "Собери слово", right, items.length, () => spellGame()); }, 1200);
        }
      }else{
        missed = true; b.classList.add("bad"); soundWrong();
        setTimeout(() => b.classList.remove("bad"), 420);
      }
    });
  }
  round();
}

/* ==========================================================================
   FIND EVERYTHING WITH… — tap every picture that starts with the letter
   (Family and Friends: read and circle the sounds at the start of words)
   ========================================================================== */

function huntWords(){
  const seen = new Set(), out = [];
  LETTERS.forEach(L => { const k = L.word.toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push({ w:L.word, art:L.art }); } });
  (window.TOPICS || []).forEach(t => { if(t.id === "colours") return; t.words.forEach(w => { const k = w.w.toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push(w); } }); });
  return out;
}
const huntPic = w => w.art ? `<span class="wpic">${ART[w.art] || ""}</span>` : wordPic(w);

function huntGame(){
  const words = huntWords();
  const starts = (w, L) => w.w[0].toLowerCase() === L.l.toLowerCase();
  const letters = shuffle(poolFor("letters").filter(L => words.filter(w => starts(w, L)).length >= 2)).slice(0, 5);
  if(!letters.length){ toast("Выбери больше букв"); back(); return; }
  let at = 0, right = 0;
  function round(){
    const L = letters[at];
    const yes = shuffle(words.filter(w => starts(w, L))).slice(0, Math.random() < 0.5 ? 2 : 3);
    const no = shuffle(words.filter(w => !starts(w, L))).slice(0, 6 - yes.length);
    const cards = shuffle(yes.concat(no));
    let found = 0, missed = false, busy = false;
    app.innerHTML = topBar("Найди всё на букву") + `
    <div class="stack">
      ${dotsHead(letters.length, at)}
      <div class="hunthead"><span class="bigl">${L.l}${L.l.toLowerCase()}</span><button class="listenbtn small" data-listen aria-label="Слушать">🔊</button></div>
      <div class="qgrid">${cards.map((c, i) => `<button class="qbtn" data-i="${i}">${huntPic(c)}</button>`).join("")}</div>
    </div>`;
    wireTop();
    onFit(() => fitGrid($(".qgrid"), 6, { cols:[2, 3], max:200, min:72 }));
    const hear = () => say(L.l, L.word);
    $("[data-listen]").onclick = hear;
    setTimeout(hear, 250);
    $$(".qbtn").forEach(b => b.onclick = () => {
      if(busy || b.classList.contains("found")) return;
      const c = cards[+b.dataset.i];
      say(c.w);
      if(starts(c, L)){
        b.classList.add("found"); b.insertAdjacentHTML("beforeend", `<span class="lab2">${esc(c.w)}</span>`); soundGood(); found++;
        if(found === yes.length){
          busy = true; if(!missed) right++;
          setTimeout(() => { at++; at < letters.length ? round() :
            finish({ title:"Найди всё на букву", game:"hunt", topic:rangeLabel("letters"), right, total:letters.length,
              stars: right / letters.length >= 0.9 ? 3 : right / letters.length >= 0.6 ? 2 : 1,
              line:`Без ошибок: ${right} из ${letters.length}`, again:() => huntGame(),
              change:() => { stack.pop(); setupScreen("hunt"); }, changeLabel:"✏️ Другие буквы" }); }, 1000);
        }
      }else{
        missed = true; b.classList.add("bad"); soundWrong();
        setTimeout(() => b.classList.remove("bad"), 420);
      }
    });
  }
  round();
}

/* ==========================================================================
   JOIN THE LETTERS — hear a letter, tap it; a line joins them in order
   (Family and Friends: listen to the sounds and join the letters)
   ========================================================================== */

function joinGame(){
  const pool = poolFor("letters");
  if(pool.length < 2){ toast("Выбери больше букв"); back(); return; }
  const steps = 6, cells = 12;
  const seq = [];
  while(seq.length < steps){ const L = pool[Math.floor(Math.random()*pool.length)]; if(!seq.length || seq[seq.length-1] !== L) seq.push(L); }
  let grid = seq.slice();
  while(grid.length < cells) grid.push(pool[Math.floor(Math.random()*pool.length)]);
  grid = shuffle(grid);
  let at = 0, missed = 0, busy = false;
  const path = [];
  app.innerHTML = topBar("Соедини буквы") + `
  <div class="stack">
    ${dotsHead(steps, 0)}
    <div class="qtop" style="margin:0 0 8px"><button class="listenbtn small" data-listen aria-label="Слушать">🔊</button></div>
    <div class="joinends"><span class="emo">🐶</span><span class="emo">🦴</span></div>
    <div class="joinwrap"><div class="jgrid">${grid.map((L, i) => `<button class="jbtn" data-i="${i}">${L.l.toLowerCase()}</button>`).join("")}</div>
      <svg class="joinsvg"><polyline points="" fill="none" stroke="#5b8cff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/></svg></div>
  </div>`;
  wireTop();
  const draw = () => {
    const box = $(".joinwrap").getBoundingClientRect();
    $(".joinsvg polyline").setAttribute("points", path.map(el => {
      const r = el.getBoundingClientRect();
      return (r.left + r.width/2 - box.left) + "," + (r.top + r.height/2 - box.top);
    }).join(" "));
  };
  onFit(() => { fitGrid($(".jgrid"), cells, { cols:[3, 4], max:110, min:56, gap:12 }); draw(); });
  const hear = () => say(seq[at].l);
  $("[data-listen]").onclick = hear;
  setTimeout(hear, 300);
  $$(".jbtn").forEach(b => b.onclick = () => {
    if(busy || b.classList.contains("on")) return;
    if(grid[+b.dataset.i] === seq[at]){
      b.classList.add("on"); path.push(b); draw(); tone([620 + at*50], 0.08);
      at++;
      const d = $$(".dots .dot")[at - 1]; if(d) d.classList.add("on");
      if(at === steps){
        busy = true; soundGood();
        setTimeout(() => finish({ title:"Соедини буквы", game:"join", topic:rangeLabel("letters"), right:steps, total:steps,
          stars: missed === 0 ? 3 : missed <= 2 ? 2 : 1,
          line: missed ? `Ошибок: ${missed}` : "Без ошибок!", again:() => joinGame(),
          change:() => { stack.pop(); setupScreen("join"); }, changeLabel:"✏️ Другие буквы" }), 900);
      }else setTimeout(hear, 450);
    }else{
      missed++; b.classList.add("bad"); soundWrong();
      setTimeout(() => { b.classList.remove("bad"); hear(); }, 420);
    }
  });
}
