<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd93d">
<title>ABC &amp; 123 — English Games</title>

<!--
  ============================================================================
  ABC & 123 — letters and numbers for young learners.
  No server, no login, nothing to install. One file.

  WHAT IS INSIDE
    Learn the alphabet      big letter + picture + the word
    Big & small letters     matching game (A with a)
    Letter and picture      matching game (A with the apple)
    Learn numbers           numeral + the word + things to count
    Number and word         matching game (3 with three)
    Count and match         matching game (3 with three balloons)

  CHANGING A WORD
    Scroll down to "THE ALPHABET". Each line looks like this:
        { l:"A", word:"apple", art:"apple" },
    You may change  word:"apple"  to another word starting with A.
    But "art" is the name of the drawing, and only the drawings listed in
    "THE DRAWINGS" exist. So if you change the word you will normally want to
    keep the old picture, or ask for a new drawing to be added.

  HOW MANY PAIRS IN ONE ROUND
    Look for  PAIRS_TEXT = 6  and  PAIRS_PICTURE = 5  below.
  ============================================================================
-->

<style>
:root{
  color-scheme: light;
  --sky:#eaf4ff;
  --ink:#2a2f45;
  --muted:#6b7391;
  --card:#ffffff;
  --line:#dfe6f5;
  --shadow:0 4px 0 rgba(42,47,69,.10), 0 10px 24px rgba(42,47,69,.10);
  --r:22px;

  --c1:#ff6b6b; --c2:#ffa63d; --c3:#ffd93d; --c4:#4ecb71;
  --c5:#3ec5e0; --c6:#5b8cff; --c7:#a878ff; --c8:#ff7ac0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--sky);
  background-image:
    radial-gradient(circle at 12% 8%, #fff3c4 0 22%, transparent 55%),
    radial-gradient(circle at 88% 4%, #ffe0ec 0 20%, transparent 55%),
    radial-gradient(circle at 50% 100%, #d9f7e6 0 30%, transparent 60%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Comic Sans MS","Chalkboard SE","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:17px; line-height:1.45; font-weight:700;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:28px;margin:0;line-height:1.2}
h2{font-size:20px;margin:0}
p{margin:0}
.muted{color:var(--muted);font-weight:700}
.small{font-size:14px}
.center{text-align:center}
.hide{display:none !important}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:10px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;min-height:52px;margin-bottom:10px}
.iconbtn{
  border:3px solid var(--line);background:var(--card);color:var(--ink);
  width:48px;height:48px;border-radius:16px;font-size:22px;cursor:pointer;
  display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(42,47,69,.10);
  font-family:inherit;
}
.iconbtn:active{transform:translateY(2px);box-shadow:none}
.top .grow{flex:1;min-width:0;text-align:center;font-size:17px;font-weight:800}

/* ---------- home tiles ---------- */
.tile{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;
  font-family:inherit;font-size:19px;font-weight:800;color:#26304a;
  box-shadow:0 5px 0 rgba(42,47,69,.16), 0 10px 22px rgba(42,47,69,.12);
}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(42,47,69,.16)}
.tile .emoji{font-size:34px;line-height:1;flex:none}
.tile .sub{display:block;font-size:13.5px;font-weight:700;opacity:.75;margin-top:2px}
.t1{background:linear-gradient(135deg,#ffe08a,#ffc93d)}
.t2{background:linear-gradient(135deg,#a8e6a1,#5ecf7d)}
.t3{background:linear-gradient(135deg,#a9d9ff,#6fb4ff)}
.t4{background:linear-gradient(135deg,#ffc0d4,#ff8fb4)}
.t5{background:linear-gradient(135deg,#d9c2ff,#b18cff)}
.t6{background:linear-gradient(135deg,#ffd0a8,#ffab6b)}

.section-label{font-size:15px;font-weight:800;color:var(--muted);margin:8px 2px 0}

/* ---------- generic card ---------- */
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}

/* ---------- buttons ---------- */
.btn{
  border:0;border-radius:18px;padding:14px 22px;font-family:inherit;
  font-size:19px;font-weight:800;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#5b8cff,#3f6fe0);
  box-shadow:0 5px 0 rgba(42,47,69,.20);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(42,47,69,.20)}
.btn.go{background:linear-gradient(135deg,#5ed67f,#33b45f)}
.btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 rgba(42,47,69,.10)}
.btn.big{width:100%;font-size:22px;padding:18px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- range picker ---------- */
.pickrow{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
select{
  font-family:inherit;font-size:26px;font-weight:800;color:var(--ink);
  border:3px solid var(--line);border-radius:16px;background:var(--card);
  padding:8px 10px;min-width:88px;text-align:center;box-shadow:0 3px 0 rgba(42,47,69,.08);
}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{
  border:3px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 14px;font-family:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;
}
.chip:active{transform:translateY(2px)}
.chip.on{background:#ffd93d;border-color:#f0bf1d}
.preview{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  font-size:20px;font-weight:800;color:#3f4a6b
}
.preview span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:2px 8px}

/* ---------- learn card ---------- */
.learn{
  background:var(--card);border:4px solid var(--line);border-radius:28px;
  padding:18px 16px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden
}
.learn::before{
  content:"";position:absolute;inset:0 0 auto;height:10px;
  background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c6),var(--c7),var(--c8))
}
.bigletters{font-size:96px;line-height:1.05;font-weight:800;letter-spacing:2px;margin:10px 0 2px}
.bignum{font-size:112px;line-height:1;font-weight:800;margin:8px 0 0}
.art{width:180px;height:180px;margin:6px auto 0}
.art svg{width:100%;height:100%;display:block}
.wordline{font-size:30px;font-weight:800;margin-top:4px}
.navrow{display:flex;align-items:center;gap:12px;margin-top:14px}
.navbtn{
  flex:1;border:0;border-radius:18px;padding:16px;font-family:inherit;font-size:24px;font-weight:800;
  background:linear-gradient(135deg,#a9d9ff,#6fb4ff);color:#123;cursor:pointer;box-shadow:0 5px 0 rgba(42,47,69,.18)
}
.navbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(42,47,69,.18)}
.navbtn.say{flex:0 0 84px;background:linear-gradient(135deg,#ffe08a,#ffc93d)}
.jump{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}
.jump.nums{grid-template-columns:repeat(5,1fr)}

/* ---------- tap a letter (one button per letter, it plays the sound) ---------- */
.t7{background:linear-gradient(135deg,#ffb3b3,#ff6b6b)}
.abcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (min-width:520px){ .abcgrid{grid-template-columns:repeat(6,1fr)} }
.abcbtn{
  position:relative;aspect-ratio:1/1;border:none;border-radius:20px;cursor:pointer;
  font-family:inherit;font-size:clamp(28px,9vw,40px);font-weight:800;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.2);
  box-shadow:0 5px 0 rgba(42,47,69,.22);transition:transform .08s;
}
.abcbtn:active,.abcbtn.playing{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 rgba(42,47,69,.22)}
.abcbtn.playing{outline:4px solid #fff;outline-offset:-9px}
.abcbtn .mark{position:absolute;top:4px;right:8px;font-size:15px;text-shadow:none}
.abcbtn.rec{animation:recpulse .7s infinite alternate;background:#e5384f !important}
@keyframes recpulse{from{filter:brightness(1)}to{filter:brightness(1.4)}}
.jump button{
  border:3px solid var(--line);background:var(--card);border-radius:14px;padding:9px 0;
  font-family:inherit;font-size:18px;font-weight:800;color:var(--ink);cursor:pointer
}
.jump button.on{background:#ffd93d;border-color:#f0bf1d}

/* ---------- matching game ---------- */
.gamehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.dot.on{background:#4ecb71;border-color:#2fa557}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.mcard{
  position:relative;border:4px solid var(--line);background:var(--card);border-radius:20px;
  min-height:74px;display:grid;place-items:center;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 0 rgba(42,47,69,.12);padding:8px;color:var(--ink);
  transition:transform .1s ease, background .15s ease, border-color .15s ease;
}
.mcard .face{font-size:42px;font-weight:800;line-height:1}
.mcard .face.word{font-size:26px}
.mcard .pic{width:100%;max-width:104px;aspect-ratio:1/1}
.mcard .pic svg{width:100%;height:100%;display:block}
.mcard .lab{display:block;font-size:17px;font-weight:800;height:0;opacity:0;transition:.25s ease}
.mcard.good .lab,.mcard.done .lab{height:auto;opacity:1;margin-top:4px}
.mcard:active{transform:translateY(2px)}
.mcard.pick{border-color:#5b8cff;background:#eaf1ff;transform:translateY(-2px) scale(1.03)}
.mcard.good{border-color:#2fa557;background:#e3f9ea;animation:pop .32s ease}
.mcard.bad{border-color:#e05252;background:#ffecec;animation:shake .34s ease}
.mcard.done{opacity:.72;pointer-events:none;box-shadow:none;border-color:#bfe8cd;background:#f2fbf5}
.mcard .tick{position:absolute;top:-10px;right:-8px;font-size:24px;opacity:0;transform:scale(.4)}
.mcard.good .tick,.mcard.done .tick{opacity:1;transform:scale(1);transition:.25s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ---------- win screen ---------- */
.win{text-align:center;padding:10px 4px}
.stars{font-size:52px;letter-spacing:6px;margin:6px 0}
.winword{font-size:32px;font-weight:800;margin:6px 0}

/* ---------- confetti ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.conf{position:absolute;top:-40px;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:#2a2f45;color:#fff;padding:12px 18px;border-radius:16px;font-size:16px;
  opacity:0;transition:.2s ease;pointer-events:none;z-index:70
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:380px){
  .bigletters{font-size:82px}
  .mcard .face{font-size:36px}
  .art{width:150px;height:150px}
}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div id="confetti"></div>
<div id="toast"></div>

<script>

/* things to count, for the number games */
const COUNT_COLORS = ["#ff6b6b","#ffa63d","#ffd93d","#4ecb71","#3ec5e0","#5b8cff","#a878ff","#ff7ac0"];

/* how many things go in one row, so the group looks tidy (index = the number) */
const PER_ROW = [0, 1,2,3,2,3, 3,4,4,3,5, 4,4,5,5,5, 4,5,5,5,5];

function countArt(n){
  const per = PER_ROW[n] || 5;
  const rows = Math.ceil(n/per);
  const pitchX = 92/per, pitchY = 92/rows;
  const size = Math.min(pitchX, pitchY) * 0.40;
  let out = `<svg viewBox="0 0 100 100">`;
  for(let r = 0, i = 0; r < rows; r++){
    const inRow = Math.min(per, n - r*per);
    for(let c = 0; c < inRow; c++, i++){
      const x = 50 + (c - (inRow-1)/2) * pitchX;
      const y = 50 + (r - (rows-1)/2) * pitchY;
      const col = COUNT_COLORS[i % COUNT_COLORS.length];
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size.toFixed(1)}" fill="${col}"/>`
           + `<circle cx="${(x-size*0.3).toFixed(1)}" cy="${(y-size*0.35).toFixed(1)}" r="${(size*0.28).toFixed(1)}" fill="#fff" opacity=".55"/>`;
    }
  }
  return out + `</svg>`;
}

/* ---------- sounds made by the browser, no files needed ---------- */
let actx = null;
function tone(freqs, dur, type){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      const t0 = actx.currentTime + i*dur*0.8;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    });
  }catch(e){}
}

/* ---------- the voice ---------- */
function speak(text){
  if(!S.speak || !("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB"; u.rate = 0.85; u.pitch = 1.1;
    const v = speechSynthesis.getVoices().find(v => /en[-_](GB|US|AU)/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ==========================================================================
   TAP A LETTER — 26 buttons, a tap plays the letter's sound

   WHERE THE SOUNDS COME FROM (first one found wins)
     1. A sound the teacher recorded on THIS device (Teacher: record sounds).
     2. A sound file in the "sounds" folder of the website, e.g. sounds/a.mp3.
        List a letter in SITE_SOUNDS once its file is there.
     3. Nothing recorded yet: the browser voice says the picture word
        ("apple"), so the child still hears the sound at the start.
   "Letter name" mode always uses the browser voice: A, B, C.
   ========================================================================== */

const SITE_SOUNDS = "";      /* e.g. "abcdefghijklmnopqrstuvwxyz" once all files are in sounds/ */
const SITE_SOUND_EXT = "mp3";
const ABC_COLORS = ["#ff6b6b","#ffa63d","#f2b705","#4ecb71","#3ec5e0","#5b8cff","#a878ff","#ff7ac0"];

/* --- recordings kept in this browser (IndexedDB) --- */
const recDB = {
  open(){
    if(this._p) return this._p;
    this._p = new Promise((ok, no) => {
      try{
        const r = indexedDB.open("abc-sounds", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("rec");
        r.onsuccess = () => ok(r.result);
        r.onerror = () => no(r.error);
      }catch(e){ no(e); }
    });
    return this._p;
  },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((ok, no) => {
      const tx = db.transaction("rec", mode), st = tx.objectStore("rec");
      const req = fn(st);
      tx.oncomplete = () => ok(req && req.result);
      tx.onerror = () => no(tx.error);
    });
  },
  get(k){ return this.run("readonly", st => st.get(k)).catch(() => null); },
  put(k, v){ return this.run("readwrite", st => st.put(v, k)); },
  async keys(){ try{ return await this.run("readonly", st => st.getAllKeys()); }catch(e){ return []; } }
};

let player = null;
function playBlobOrUrl(src){
  try{ if(player){ player.pause(); } }catch(e){}
  player = new Audio(src);
  return player.play();
}

async function playLetterSound(L){
  const k = L.l.toLowerCase();
  if(S.abcMode === "name"){ speak(L.l); return; }
  const mine = await recDB.get(k);
  if(mine){ try{ speechSynthesis.cancel(); }catch(e){} playBlobOrUrl(URL.createObjectURL(mine)); return; }
  if(SITE_SOUNDS.includes(k)){ playBlobOrUrl("sounds/" + k + "." + SITE_SOUND_EXT).catch(() => speak(L.word)); return; }
  speak(L.word);
}

    ${abcGrid(done)}
    <div class="btn-row">
      <button class="btn go" data-zip ${done.size ? "" : "disabled"}>⬇ Download my recordings</button>
    </div>
  </div>`;
  wireTop();
  $$(".abcbtn").forEach(b => b.onclick = () => toggleRecord(b, LETTERS[+b.dataset.i]));
  $("[data-zip]").onclick = downloadRecordings;
}

async function toggleRecord(btn, L){
  if(recorder && recorder.state === "recording"){ recorder.stop(); return; }
  try{
    micStream = micStream || await navigator.mediaDevices.getUserMedia({ audio:true });
  }catch(e){ toast("The microphone is blocked — allow it in the browser"); return; }
  const chunks = [];
  recorder = new MediaRecorder(micStream);
  recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    clearTimeout(recTimer);
    btn.classList.remove("rec");
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    recorder = null;
    await recDB.put(L.l.toLowerCase(), blob);
    playBlobOrUrl(URL.createObjectURL(blob));
    if(!btn.querySelector(".mark")) btn.insertAdjacentHTML("beforeend", '<span class="mark">✅</span>');
    const n = (await recDB.keys()).length;
    const c = document.getElementById("recCount"); if(c) c.textContent = n;
    const z = $("[data-zip]"); if(z) z.disabled = false;
  };
  try{ speechSynthesis.cancel(); }catch(e){}
  recorder.start();
  btn.classList.add("rec");
  recTimer = setTimeout(() => { if(recorder && recorder.state === "recording") recorder.stop(); }, 2000);
}

function extFor(type){
  if(/mp4|m4a|aac/.test(type)) return "m4a";
  if(/ogg/.test(type)) return "ogg";
  if(/mpeg|mp3/.test(type)) return "mp3";
  return "webm";
}

async function downloadRecordings(){
  const keys = await recDB.keys();
  if(!keys.length) return;
  toast("Packing the sounds…");
  if(!window.JSZip){
    await new Promise((ok, no) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
      s.onload = ok; s.onerror = no; document.head.appendChild(s);
    }).catch(() => null);
  }
  if(!window.JSZip){ toast("Could not pack the files — check the internet"); return; }
  const zip = new JSZip();
  for(const k of keys){ const b = await recDB.get(k); if(b) zip.file(k + "." + extFor(b.type), b); }
  const out = await zip.generateAsync({ type:"blob" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(out); a.download = "letter-sounds.zip";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ==========================================================================
   LEARN — NUMBERS
   ========================================================================== */

let numIdx = 1;

function learnNumbers(){
  const n = numIdx;
  app.innerHTML = topBar("Learn numbers") + `
  <div class="stack">
    <div class="learn">
      <div class="bignum">${n}</div>
      <div class="wordline">${NUMBER_WORDS[n]}</div>
      <div class="art" style="width:200px;height:150px">${countArt(n)}</div>
      <div class="navrow">
        <button class="navbtn" data-prev aria-label="Previous number">◀</button>
        <button class="navbtn say" data-say aria-label="Say it">🔊</button>
        <button class="navbtn" data-next aria-label="Next number">▶</button>
      </div>
    </div>
    <div class="card">
      <p class="muted small center" style="margin-bottom:8px">Tap any number</p>
      <div class="jump nums">
        ${Array.from({length:MAX_NUMBER}, (_,i) => i+1).map(x =>
          `<button data-n="${x}" class="${x===numIdx?"on":""}">${x}</button>`).join("")}
      </div>
    </div>

  $("[data-prev]").onclick = () => { numIdx = numIdx <= 1 ? MAX_NUMBER : numIdx - 1; learnNumbers(); sayNumber(); };

  $("[data-say]").onclick = sayNumber;

function sayNumber(){
  speak(NUMBER_WORDS[numIdx]);
  tone([700], 0.08);
}

/* ==========================================================================
   THE GAMES — what each one matches
   ========================================================================== */

const GAMES = {
  case: {
    title:"Big & small letters",
    what:"Which letters?",
    kind:"letters", pairs:PAIRS_TEXT,
    left:  it => ({ html:`<span class="face">${it.l}</span>`, say:it.l }),
    right: it => ({ html:`<span class="face">${it.l.toLowerCase()}</span>`, say:it.l }),
    cheer: it => it.l + " " + it.l.toLowerCase()
  },
  pic: {
    title:"Letters and pictures",
    what:"Which letters?",
    kind:"letters", pairs:PAIRS_PICTURE,
    left:  it => ({ html:`<span class="face">${it.l}${it.l.toLowerCase()}</span>`, say:it.l }),
    right: it => ({ html:`<span class="pic">${ART[it.art]||""}</span><span class="lab">${firstLetterBold(it.word)}</span>`, say:it.word }),
    cheer: it => it.l + " — " + it.word
  },
  numword: {
    title:"Number & word",
    what:"Which numbers?",
    kind:"numbers", pairs:PAIRS_TEXT,
    left:  it => ({ html:`<span class="face">${it.n}</span>`, say:NUMBER_WORDS[it.n] }),
    right: it => ({ html:`<span class="face word">${NUMBER_WORDS[it.n]}</span>`, say:NUMBER_WORDS[it.n] }),
    cheer: it => it.n + " — " + NUMBER_WORDS[it.n]
  },
  numcount: {
    title:"Count and match",
    what:"Which numbers?",
    kind:"numbers", pairs:PAIRS_PICTURE,
    left:  it => ({ html:`<span class="face">${it.n}</span>`, say:NUMBER_WORDS[it.n] }),
    right: it => ({ html:`<span class="pic">${countArt(it.n)}</span><span class="lab">${NUMBER_WORDS[it.n]}</span>`, say:NUMBER_WORDS[it.n] }),
    cheer: it => it.n + " — " + NUMBER_WORDS[it.n]
  }
};

/* ==========================================================================
   CHOOSING THE LETTERS OR NUMBERS
   ========================================================================== */

function poolFor(kind){
  if(kind === "letters"){
    const a = clamp(S.from, 0, 25), b = clamp(S.to, 0, 25);
    return LETTERS.slice(Math.min(a,b), Math.max(a,b)+1);
  }
  const a = clamp(S.nFrom, 1, MAX_NUMBER), b = clamp(S.nTo, 1, MAX_NUMBER);
  const out = [];
  for(let n = Math.min(a,b); n <= Math.max(a,b); n++) out.push({ n });
  return out;
}

function setupScreen(gameId){
  const G = GAMES[gameId];
  const letters = G.kind === "letters";
  const opts = letters
    ? LETTERS.map((x,i) => ({ v:i, label:x.l }))
    : Array.from({length:MAX_NUMBER}, (_,i) => ({ v:i+1, label:String(i+1) }));
  const from = letters ? S.from : S.nFrom;
  const to   = letters ? S.to   : S.nTo;
  const presets = letters
    ? [["A – E",0,4],["A – H",0,7],["A – M",0,12],["A – Z",0,25]]
    : [["1 – 5",1,5],["1 – 10",1,10],["1 – 12",1,12],["1 – 20",1,20]];

  app.innerHTML = topBar(G.title) + `
  <div class="stack">
    <div class="card center">
      <h2>${G.what}</h2>
      <p class="muted small" style="margin:6px 0 14px">Only the ones you choose will be in the game.</p>
      <div class="chips" style="margin-bottom:14px">
        ${presets.map(([lab,a,b]) =>
          `<button class="chip ${from===a&&to===b?"on":""}" data-preset="${a},${b}">${lab}</button>`).join("")}
      </div>
      <div class="pickrow">
        <span class="muted">from</span>
        <select data-from>${opts.map(o => `<option value="${o.v}" ${o.v===from?"selected":""}>${o.label}</option>`).join("")}</select>
        <span class="muted">to</span>
        <select data-to>${opts.map(o => `<option value="${o.v}" ${o.v===to?"selected":""}>${o.label}</option>`).join("")}</select>
      </div>
      <div class="preview" id="prev" style="margin-top:14px"></div>
    </div>
    <button class="btn go big" data-start>▶ Start playing</button>
  </div>`;
  wireTop();

  const drawPreview = () => {
    const pool = poolFor(G.kind);
    $("#prev").innerHTML = pool.map(it =>
      `<span>${letters ? it.l + it.l.toLowerCase() : it.n}</span>`).join("");
  };
  const setRange = (a, b) => {
    if(letters){ S.from = a; S.to = b; } else { S.nFrom = a; S.nTo = b; }
    save();
  };

  $$("[data-preset]").forEach(b => b.onclick = () => {
    const [a,c] = b.dataset.preset.split(",").map(Number);
    setRange(a, c); setupScreen(gameId);
  });
  $("[data-from]").onchange = e => { setRange(+e.target.value, to); setupScreen(gameId); };
  $("[data-to]").onchange   = e => { setRange(from, +e.target.value); setupScreen(gameId); };
  $("[data-start]").onclick = () => go(() => playRound(gameId));
  drawPreview();
}

/* ==========================================================================
   THE MATCHING GAME
   ========================================================================== */

function playRound(gameId){
  const G = GAMES[gameId];
  const pool = poolFor(G.kind);
  const size = Math.min(G.pairs, pool.length);
  const round = shuffle(pool).slice(0, size);

  const key = it => G.kind === "letters" ? it.l : String(it.n);
  const leftCards  = shuffle(round).map(it => ({ id:key(it), it, side:"L", ...G.left(it) }));
  const rightCards = shuffle(round).map(it => ({ id:key(it), it, side:"R", ...G.right(it) }));

  let matched = 0, mistakes = 0, pickL = null, pickR = null, busy = false;

  const cardHtml = (c, i) =>
    `<button class="mcard" data-side="${c.side}" data-i="${i}" data-id="${esc(c.id)}">
       ${c.html}<span class="tick">⭐</span>
     </button>`;

  app.innerHTML = topBar(G.title) + `
  <div class="stack">
    <div class="gamehead">
      <div class="dots" id="dots">${round.map(() => `<span class="dot"></span>`).join("")}</div>
      <span class="muted small" id="count">0 / ${size}</span>
    </div>
    <div class="board">
      ${round.map((_, i) => cardHtml(leftCards[i], i) + cardHtml(rightCards[i], i)).join("")}
    </div>
    <div class="center"><button class="btn ghost small" data-again>🔀 New cards</button></div>
  </div>`;
  wireTop();
  $("[data-again]").onclick = () => playRound(gameId);

  const cardsEl = $$(".mcard");
  const elOf = (side, i) => cardsEl.find(e => e.dataset.side === side && +e.dataset.i === i);

  function clearPick(){
    if(pickL !== null) elOf("L", pickL).classList.remove("pick");
    if(pickR !== null) elOf("R", pickR).classList.remove("pick");
    pickL = pickR = null;
  }

  function check(){
    if(pickL === null || pickR === null) return;
    const a = elOf("L", pickL), b = elOf("R", pickR);
    busy = true;
    if(a.dataset.id === b.dataset.id){
      const item = leftCards[pickL].it;
      a.classList.remove("pick"); b.classList.remove("pick");
      a.classList.add("good"); b.classList.add("good");
      soundGood(); speak(G.cheer(item));
      matched++;
      const dots = $$("#dots .dot");
      if(dots[matched-1]) dots[matched-1].classList.add("on");
      $("#count").textContent = matched + " / " + size;
      pickL = pickR = null;
      setTimeout(() => {
        a.classList.remove("good"); b.classList.remove("good");
        a.classList.add("done");   b.classList.add("done");
        busy = false;
        if(matched === size) setTimeout(() => winScreen(gameId, mistakes, size), 420);
      }, 520);
    }else{
      mistakes++;
      a.classList.add("bad"); b.classList.add("bad");
      soundWrong();
      setTimeout(() => {
        a.classList.remove("bad","pick"); b.classList.remove("bad","pick");
        pickL = pickR = null; busy = false;
      }, 460);
    }
  }

  cardsEl.forEach(el => el.onclick = () => {
    if(busy || el.classList.contains("done")) return;
    const side = el.dataset.side, i = +el.dataset.i;
    if(side === "L"){
      if(pickL === i){ el.classList.remove("pick"); pickL = null; return; }
      if(pickL !== null) elOf("L", pickL).classList.remove("pick");
      pickL = i;
    }else{
      if(pickR === i){ el.classList.remove("pick"); pickR = null; return; }
      if(pickR !== null) elOf("R", pickR).classList.remove("pick");
      pickR = i;
    }
    el.classList.add("pick");
    tone([520], 0.06);
    const c = (side === "L" ? leftCards : rightCards)[i];
    if(pickL === null || pickR === null) speak(c.say);
    check();
  });
}

/* ==========================================================================
   WELL DONE!
   ========================================================================== */

function winScreen(gameId, mistakes, size){
  const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
  const words = ["Well done!","Great job!","Super!","Brilliant!","Fantastic!","You did it!"];
  const cheer = words[Math.floor(Math.random()*words.length)];
  confetti(); soundWin(); speak(cheer);

  app.innerHTML = topBar(GAMES[gameId].title) + `
  <div class="card win">
    <div style="font-size:64px;line-height:1">🎉</div>
    <div class="winword">${cheer}</div>
    <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
    <p class="muted small">${size} pairs matched${mistakes ? " · " + mistakes + (mistakes===1 ? " try again" : " tries again") : " · no mistakes!"}</p>
    <div class="stack-sm" style="margin-top:18px">
      <button class="btn go big" data-again>▶ Play again</button>
      <button class="btn ghost big" data-change>✏️ Change the letters</button>
      <button class="btn ghost big" data-home>🏠 Home</button>
    </div>
  </div>`;
  wireTop();
  if(GAMES[gameId].kind === "numbers") $("[data-change]").innerHTML = "✏️ Change the numbers";
  $("[data-again]").onclick  = () => playRound(gameId);
  $("[data-change]").onclick = () => { stack.pop(); setupScreen(gameId); };
  $("[data-home]").onclick   = home;
}

/* ==========================================================================
   START
   ========================================================================== */

home();
</script>
