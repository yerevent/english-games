<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>English Games</title>

<!--
  ============================================================================
  ENGLISH GAMES — no server, no accounts, no login.

  WHERE THE CONTENT LIVES
    content/a1-vocab.js      themed vocabulary sets
    content/a1-grammar-1.js  grammar topics 1–13 (explanation + exercises)
    content/a1-grammar-2.js  grammar topics 14–25
    content/a1-modules.js    the 10 modules, speaking tasks, writing tasks
  Open any of those in Notepad and copy a line to add a word or a question.

  A GOOGLE SHEET can also feed the older A2/B1/B2 material — paste the
  published CSV links into SHEET_CSV below. Left empty, the built-in
  sample content is used instead.
  ============================================================================
-->

<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#12141c; --muted:#6b7180;
  --line:#e6e8f0; --accent:#4f46e5; --accent-soft:#eef0ff;
  --good:#0f9d6e; --good-soft:#e6f7f1; --bad:#dc2743; --bad-soft:#fdeaed;
  --warn:#b45309; --warn-soft:#fef3c7;
  --shadow:0 1px 2px rgba(16,20,40,.05), 0 8px 24px rgba(16,20,40,.06);
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1016; --card:#171a23; --ink:#eceef5; --muted:#9aa1b4;
    --line:#262b38; --accent:#8b87ff; --accent-soft:#20213a;
    --good:#3ddc9b; --good-soft:#12291f; --bad:#ff7089; --bad-soft:#2b151b;
    --warn:#fbbf24; --warn-soft:#2a2110;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 72px}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.02em}
h1{font-size:26px;font-weight:750}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12.5px}
.hide{display:none !important}
.center{text-align:center}

.top{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:18px}
.back{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  width:40px;height:40px;border-radius:12px;font-size:19px;cursor:pointer;
  display:grid;place-items:center;flex:none;box-shadow:var(--shadow)
}
.back:active{transform:scale(.94)}
.crumb{font-size:13px;color:var(--muted);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}

.row{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;cursor:pointer;color:var(--ink);font:inherit;
  box-shadow:var(--shadow);transition:transform .12s ease, border-color .12s ease
}
.row:hover{border-color:var(--accent)}
.row:active{transform:scale(.985)}
.row .grow{flex:1;min-width:0}
.row .chev{color:var(--muted);font-size:20px;flex:none}
.row-title{font-weight:650;font-size:16.5px}
.badge{
  flex:none;min-width:46px;height:46px;padding:0 10px;border-radius:14px;
  background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:750;font-size:15px
}
.emoji{flex:none;font-size:26px;width:46px;height:46px;display:grid;place-items:center;background:var(--accent-soft);border-radius:14px}
.done-tick{color:var(--good);font-weight:750;font-size:15px;flex:none}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:14px;padding:13px 16px;font:inherit;font-weight:650;
  cursor:pointer;box-shadow:var(--shadow)
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.28)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1;min-width:130px}

.strip{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:750;letter-spacing:-.03em}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:650}

.seg{display:flex;background:var(--accent-soft);border-radius:14px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:650;padding:9px 12px;border-radius:11px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.hud{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{flex:1;height:9px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease;width:0}
.score{font-weight:750;font-size:14px;font-variant-numeric:tabular-nums}
.clock{font-weight:750;font-size:14px;font-variant-numeric:tabular-nums;color:var(--accent);min-width:34px;text-align:right}
.clock.low{color:var(--bad)}

.question{font-size:22px;font-weight:650;line-height:1.45;letter-spacing:-.02em;margin:8px 0 20px}
.blank{display:inline-block;min-width:74px;border-bottom:3px solid var(--accent);vertical-align:baseline;margin:0 3px}
.blank.filled{border-bottom-color:var(--muted);color:var(--accent);font-weight:750}
.opt{
  width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:15px;padding:15px 16px;font:inherit;font-weight:600;font-size:16.5px;
  color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)
}
.opt:active{transform:scale(.985)}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12.5px;font-weight:750}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .key{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.5}

.feedback{border-radius:15px;padding:14px 16px;margin-top:6px;border:1px solid var(--line)}
.feedback.good{background:var(--good-soft);border-color:var(--good)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.feedback .fb-title{font-weight:750;margin-bottom:3px}

/* word chips: sentence builder + drag & drop */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.chip-w{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:11px 14px;font:inherit;font-weight:650;font-size:16px;
  cursor:pointer;box-shadow:var(--shadow)
}
.chip-w:active{transform:scale(.95)}
.chip-w.used{opacity:.25;pointer-events:none}
.answer-area{
  min-height:64px;border:1.5px dashed var(--line);border-radius:15px;padding:12px;
  display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--accent-soft)
}
.answer-area.correct{border-color:var(--good);border-style:solid;background:var(--good-soft)}
.answer-area.wrong{border-color:var(--bad);border-style:solid;background:var(--bad-soft)}
.answer-area .ph{color:var(--muted);font-size:14px;align-self:center}

/* error correction */
.fix-sentence{font-size:21px;font-weight:650;line-height:1.7;margin:10px 0 6px}
.fix-w{
  display:inline-block;border-radius:8px;padding:2px 5px;margin:0 1px;cursor:pointer;
  border:1.5px solid transparent
}
.fix-w:hover{border-color:var(--accent)}
.fix-w.hit{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.fix-w.miss{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

/* memory match */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid.three{grid-template-columns:1fr 1fr 1fr}
.tile{
  min-height:82px;border:1.5px solid var(--line);background:var(--card);border-radius:15px;
  padding:12px 10px;font:inherit;font-weight:600;font-size:15.5px;color:var(--ink);
  cursor:pointer;display:grid;place-items:center;text-align:center;line-height:1.3;
  box-shadow:var(--shadow);transition:transform .12s ease, opacity .25s ease
}
.tile:active{transform:scale(.96)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tile.hit{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.tile.miss{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .35s}
.tile.done{opacity:.25;pointer-events:none}
.tile.face-down{background:var(--accent);border-color:var(--accent);color:#fff;font-size:24px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* flashcards */
.flashcard{
  min-height:230px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);
  box-shadow:var(--shadow);display:grid;place-items:center;padding:26px;text-align:center;cursor:pointer
}
.flashcard .fc-word{font-size:32px;font-weight:750;letter-spacing:-.03em}
.flashcard .fc-mean{font-size:19px;font-weight:600;line-height:1.45}
.flashcard .fc-ex{font-size:14.5px;color:var(--muted);margin-top:12px;font-style:italic}
.flashcard .fc-hint{font-size:12.5px;color:var(--muted);margin-top:16px}

/* unscramble */
.scramble{font-size:34px;font-weight:800;letter-spacing:.14em;text-align:center;margin:12px 0;color:var(--accent)}

/* verbs + typing */
.verb-prompt{font-size:30px;font-weight:750;letter-spacing:-.03em;text-align:center;margin:10px 0 4px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input, .field textarea{
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:13px;padding:14px;font:inherit;font-size:17px;font-weight:600;width:100%
}
.field textarea{font-weight:500;font-size:16px;line-height:1.6;min-height:190px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field input.correct{border-color:var(--good);background:var(--good-soft)}
.field input.wrong{border-color:var(--bad);background:var(--bad-soft)}

table.study{width:100%;border-collapse:collapse;font-size:14.5px}
table.study th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
table.study td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.study tr:last-child td{border-bottom:0}

/* grammar explanation */
.rulebox{background:var(--accent-soft);border-radius:15px;padding:14px 16px}
.rulebox ul{margin:0;padding-left:20px}
.rulebox li{margin:5px 0;font-size:15px}
.exline{padding:9px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.exline:last-child{border-bottom:0}
.tipbox{background:var(--warn-soft);border:1px solid var(--warn);border-radius:15px;padding:13px 15px;font-size:14.5px}
.tipbox b{color:var(--warn)}

/* speaking */
.rolecard{border:1.5px solid var(--accent);border-radius:15px;padding:14px 16px;background:var(--accent-soft)}
.rolecard h3{color:var(--accent);margin-bottom:5px}
.qlist{counter-reset:q}
.qlist li{margin:9px 0;font-size:16px;font-weight:600}
.checklist{list-style:none;padding:0;margin:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.checklist li:last-child{border-bottom:0}
.checklist .box{flex:none;width:20px;height:20px;border:2px solid var(--line);border-radius:6px;margin-top:1px;cursor:pointer;display:grid;place-items:center;font-size:13px;color:#fff}
.checklist .box.on{background:var(--good);border-color:var(--good)}

/* wheel */
.wheel-face{
  min-height:180px;border-radius:20px;background:var(--accent);color:#fff;display:grid;place-items:center;
  padding:26px;text-align:center;font-size:21px;font-weight:700;line-height:1.4;
  box-shadow:0 10px 30px rgba(79,70,229,.3);transition:transform .3s ease
}
.wheel-face.spin{transform:scale(.94);opacity:.6}

.wordcount{font-size:13px;font-weight:650;color:var(--muted)}
.wordcount.ok{color:var(--good)}

.big-score{font-size:56px;font-weight:800;letter-spacing:-.045em;line-height:1}
.review{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.review .q{font-weight:600;font-size:14.5px}
.review .a{font-size:14px;color:var(--good);font-weight:650}
.review .yours{font-size:13.5px;color:var(--bad)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;
  font-size:14px;font-weight:650;box-shadow:0 10px 30px rgba(0,0,0,.25);
  opacity:0;transition:all .28s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:50;max-width:88vw;text-align:center
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div class="wrap">
  <div id="app">
    <div class="card center" style="padding:40px">
      <div class="spinner"></div>
      <p class="muted small" style="margin-top:14px">Loading…</p>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="content/a1-vocab.js"></script>
<script src="content/a1-grammar-1.js"></script>
<script src="content/a1-grammar-2.js"></script>
<script src="content/a1-modules.js"></script>

<script>
"use strict";

/* ==========================================================================
   1. CONFIG
   ========================================================================== */

const SITE_NAME = "English Games";
const ROUND_LENGTH = 10;
const MATCH_PAIRS  = 6;
const MEMORY_PAIRS = 6;
const TIMED_SECONDS = 15;

// Optional Google Sheet for the older A2/B1/B2 material. Leave empty to use samples.
const SHEET_CSV = { vocabulary:"", quiz:"", irregular:"" };

const LEVELS = [
  { code:"A1", name:"Beginner" }, { code:"A2", name:"Elementary" },
  { code:"B1", name:"Intermediate" }, { code:"B2", name:"Upper-Intermediate" },
  { code:"C1", name:"Advanced" }
];

const GRAMMAR = (window.A1_GRAMMAR_1 || []).concat(window.A1_GRAMMAR_2 || []);
const VOCAB   = window.A1_VOCAB || [];
const MODULES = window.A1_MODULES || [];

/* Which practice games exist, and where they get their questions from. */
const GAMES = {
  mcq:       {name:"Multiple Choice",   emoji:"📝", src:"mcq",   blurb:"Choose the correct answer"},
  gap:       {name:"Fill in the Blanks",emoji:"⌨️", src:"gap",   blurb:"Type the missing word"},
  drag:      {name:"Drag & Drop",       emoji:"🧲", src:"gap",   blurb:"Tap the word to drop it in the gap"},
  build:     {name:"Sentence Builder",  emoji:"🧱", src:"build", blurb:"Put the words in the right order"},
  fix:       {name:"Error Correction",  emoji:"🔍", src:"fix",   blurb:"Find the mistake in the sentence"},
  timed:     {name:"Timed Challenge",   emoji:"⚡", src:"mcq",   blurb:TIMED_SECONDS + " seconds per question"},
  match:     {name:"Memory Match",      emoji:"🃏", src:"vocab", blurb:"Match each word to its meaning"},
  memory:    {name:"Hidden Pairs",      emoji:"🎴", src:"vocab", blurb:"Turn the cards over and find the pairs"},
  cards:     {name:"Flashcards",        emoji:"🗂️", src:"vocab", blurb:"Flip through the words"},
  unscramble:{name:"Unscramble",        emoji:"🔤", src:"vocab", blurb:"Put the letters in order"},
  wheel:     {name:"Speaking Wheel",    emoji:"🎡", src:"speak", blurb:"Spin for a question to answer out loud"}
};

/* ==========================================================================
   2. LEGACY SAMPLE CONTENT — A2/B1/B2 only (A1 now comes from the content files)
   ========================================================================== */

const SAMPLE = {
vocabulary: [
  {level:"A2",topic:"Travel",english:"luggage",meaning:"the bags you take on a journey"},
  {level:"A2",topic:"Travel",english:"departure",meaning:"the moment a plane or train leaves"},
  {level:"A2",topic:"Travel",english:"delayed",meaning:"later than the planned time"},
  {level:"A2",topic:"Travel",english:"boarding pass",meaning:"the card that lets you get on the plane"},
  {level:"A2",topic:"Travel",english:"abroad",meaning:"in or to a foreign country"},
  {level:"A2",topic:"Travel",english:"crowded",meaning:"full of people"},
  {level:"B1",topic:"Work",english:"deadline",meaning:"the day something must be finished"},
  {level:"B1",topic:"Work",english:"colleague",meaning:"a person you work with"},
  {level:"B1",topic:"Work",english:"promotion",meaning:"a move to a more important job"},
  {level:"B1",topic:"Work",english:"overtime",meaning:"extra hours worked beyond the normal day"},
  {level:"B1",topic:"Work",english:"shift",meaning:"a fixed period of working time"},
  {level:"B1",topic:"Work",english:"workload",meaning:"the amount of work you have to do"},
  {level:"B2",topic:"Technology",english:"glitch",meaning:"a small, temporary fault in a system"},
  {level:"B2",topic:"Technology",english:"obsolete",meaning:"no longer used because something better exists"},
  {level:"B2",topic:"Technology",english:"user-friendly",meaning:"easy to use, even for beginners"},
  {level:"B2",topic:"Technology",english:"back up",meaning:"to make a spare copy of your files"},
  {level:"B2",topic:"Technology",english:"cutting-edge",meaning:"the most modern and advanced"},
  {level:"B2",topic:"Technology",english:"privacy settings",meaning:"controls over who can see your information"}
],
quiz: [
  {level:"A2",grammar:"Past Simple",question:"We ___ to Italy last summer.",correct:"went",wrong:["go","goed","have gone"],explanation:"Go is irregular: go — went — gone."},
  {level:"A2",grammar:"Past Simple",question:"She ___ her keys yesterday.",correct:"lost",wrong:["lose","losed","has lost"],explanation:"Lose — lost — lost."},
  {level:"A2",grammar:"Past Simple",question:"___ you see the film last night?",correct:"Did",wrong:["Do","Have","Was"],explanation:"Past Simple questions use did + the basic verb."},
  {level:"A2",grammar:"Past Simple",question:"They ___ come to the party.",correct:"didn't",wrong:["don't","haven't","wasn't"],explanation:"The negative is didn't + basic verb."},
  {level:"A2",grammar:"Past Simple",question:"He ___ football when he was young.",correct:"played",wrong:["play","plaid","has played"],explanation:"Regular verbs add -ed."},
  {level:"A2",grammar:"Past Simple",question:"The train ___ twenty minutes late.",correct:"was",wrong:["were","is","did"],explanation:"The train is singular, so we use was."},
  {level:"B1",grammar:"Present Perfect",question:"I ___ never been to Japan.",correct:"have",wrong:["has","am","did"],explanation:"After I we use have."},
  {level:"B1",grammar:"Present Perfect",question:"She ___ just finished her homework.",correct:"has",wrong:["have","is","did"],explanation:"After she we use has."},
  {level:"B1",grammar:"Present Perfect",question:"We've lived here ___ 2019.",correct:"since",wrong:["for","from","ago"],explanation:"Since + a point in time."},
  {level:"B1",grammar:"Present Perfect",question:"They've known each other ___ ten years.",correct:"for",wrong:["since","from","during"],explanation:"For + a period of time."},
  {level:"B1",grammar:"Present Perfect",question:"___ you ever tried sushi?",correct:"Have",wrong:["Did","Do","Are"],explanation:"Ever with Present Perfect asks about your whole life."},
  {level:"B1",grammar:"Present Perfect",question:"He hasn't called me ___.",correct:"yet",wrong:["still","already","ago"],explanation:"Yet goes at the end of negatives and questions."},
  {level:"B2",grammar:"Conditionals",question:"If I ___ more time, I would travel more.",correct:"had",wrong:["have","will have","would have"],explanation:"Second conditional: if + past simple, would + basic verb."},
  {level:"B2",grammar:"Conditionals",question:"If it rains tomorrow, we ___ at home.",correct:"will stay",wrong:["would stay","stayed","had stayed"],explanation:"First conditional: if + present simple, will + basic verb."},
  {level:"B2",grammar:"Conditionals",question:"If she had studied, she ___ the exam.",correct:"would have passed",wrong:["would pass","passed","will pass"],explanation:"Third conditional: would have + past participle."},
  {level:"B2",grammar:"Conditionals",question:"I wouldn't do that if I ___ you.",correct:"were",wrong:["am","was being","would be"],explanation:"We say 'if I were you' for advice."},
  {level:"A2",topic:"Travel",question:"Our flight was ___ by two hours because of the snow.",correct:"delayed",wrong:["cancelled","crowded","booked"],explanation:"Delayed = later than planned."},
  {level:"B1",topic:"Work",question:"I can't come out tonight — I have a ___ tomorrow.",correct:"deadline",wrong:["colleague","promotion","shift"],explanation:"A deadline is when work must be finished."}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function uniq(a){ return Array.from(new Set(a)); }
function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }

function toast(msg){

}

/* Some error-correction items carry a note in brackets, e.g. "… (two parents)".
   Split it off so it isn't a tappable word. */
function splitNote(sentence){
  const m = sentence.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
  return m ? { text:m[1], note:m[2] } : { text:sentence, note:"" };
}
function firstDiff(bad, good){
  const b = bad.split(" "), g = good.split(" ");
  for(let i = 0; i < b.length; i++){
    if(b[i].toLowerCase() !== (g[i] || "").toLowerCase()) return i;
  }
  return b.length - 1;
}
function normalise(s){
  return String(s).toLowerCase().trim()
    .replace(/[.,!?;:]/g, "").replace(/[''`]/g, "'").replace(/\s+/g, " ");
}

/* ==========================================================================
   5. LEGACY SHEET / SAMPLE LOADING (A2+)
   ========================================================================== */

let DATA = { vocabulary:[], quiz:[], irregular:[] };
let SOURCE = "sample";

function parseCSV(text){
  const rows = []; let row = [], field = "", inQ = false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === ","){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
  }
  row.push(field);
  if(row.length > 1 || row[0] !== "") rows.push(row);
  return rows;
}
function csvToObjects(text){
  const rows = parseCSV(text);
  if(!rows.length) return [];
  const head = rows[0].map(h => h.trim().toLowerCase().replace(/\s+/g,""));
  return rows.slice(1).map(r => {
    const o = {}; head.forEach((h,i) => o[h] = (r[i] || "").trim()); return o;
  }).filter(o => Object.values(o).some(v => v !== ""));
}
const mapVocabRow = o => (!o.english || !o.meaning) ? null : {
  level:(o.level || "A2").toUpperCase(), topic:o.topic || "General",
  english:o.english, meaning:o.meaning, image:o.imageurl || "" };
const mapQuizRow = o => (!o.question || !o.correct) ? null : {
  level:(o.level || "A2").toUpperCase(), topic:o.topic || "", grammar:o.grammar || "",
  question:o.question, correct:o.correct,
  wrong:[o.wrong1,o.wrong2,o.wrong3].filter(w => w && w.trim()),
  explanation:o.explanation || "" };
const mapVerbRow = o => (!o.infinitive || !o.pastsimple) ? null : {
  infinitive:o.infinitive, past:o.pastsimple, participle:o.pastparticiple || "",
  level:(o.level || "A1").toUpperCase(), meaning:o.meaning || "" };

async function fetchTab(url, mapper){
  const res = await fetch(url, { cache:"no-store" });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const rows = csvToObjects(await res.text()).map(mapper).filter(Boolean);
  if(!rows.length) throw new Error("empty");
  return rows;
}
async function loadData(){
  if(Object.values(SHEET_CSV).some(u => u)){
    try{
      const [v,q,i] = await Promise.all([
        SHEET_CSV.vocabulary ? fetchTab(SHEET_CSV.vocabulary, mapVocabRow) : Promise.resolve(SAMPLE.vocabulary),
        SHEET_CSV.quiz       ? fetchTab(SHEET_CSV.quiz, mapQuizRow)        : Promise.resolve(SAMPLE.quiz),
        SHEET_CSV.irregular  ? fetchTab(SHEET_CSV.irregular, mapVerbRow)   : Promise.resolve(SAMPLE.irregular)
      ]);
      DATA = { vocabulary:v, quiz:q, irregular:i }; SOURCE = "live";
      try{ localStorage.setItem("eg_cache_v1", JSON.stringify(DATA)); }catch(e){}
      return;
    }catch(e){
      try{
        const c = localStorage.getItem("eg_cache_v1");
        if(c){ DATA = JSON.parse(c); SOURCE = "cache"; return; }
      }catch(e2){}
    }
  }
  DATA = JSON.parse(JSON.stringify(SAMPLE)); SOURCE = "sample";
}
function quizFor(f){
  return DATA.quiz.filter(q =>
    (!f.level || q.level === f.level) && (!f.grammar || q.grammar === f.grammar) &&
    (!f.topic || q.topic === f.topic) && q.wrong && q.wrong.length);
}
function vocabFor(f){
  return DATA.vocabulary.filter(v => (!f.level || v.level === f.level) && (!f.topic || v.topic === f.topic));
}
const topicsIn  = lv => uniq(vocabFor({level:lv}).map(v => v.topic)).sort();
const grammarIn = lv => uniq(DATA.quiz.filter(q => q.level === lv && q.grammar).map(q => q.grammar)).sort();
const legacyLevels = () => LEVELS.filter(l => l.code !== "A1" && (vocabFor({level:l.code}).length || quizFor({level:l.code}).length));

function screenSpeaking(n, kind){
  const m = moduleByN(n), s = m.speaking;
  let title = "", body = "";

  if(kind === "roleplay"){
    title = "Role-play";
    body = `<h1>🎭 ${esc(s.roleplay.title)}</h1>
      <p class="muted small">${esc(s.roleplay.setup)}</p>
      <div class="rolecard"><h3>Student A</h3><p>${esc(s.roleplay.a)}</p></div>
      <div class="rolecard"><h3>Student B</h3><p>${esc(s.roleplay.b)}</p></div>
      <div class="tipbox">Do it twice — then swap roles.</div>`;
  } else if(kind === "picture"){
    title = "Picture description";
    body = `<h1>🖼️ Picture description</h1>
      <div class="card"><p style="font-size:18px;font-weight:600">${esc(s.picture)}</p></div>
      <div class="tipbox"><b>In class:</b> the teacher shows a picture. <b>At home:</b> find any photo on your phone that fits, and describe it out loud for one minute.</div>`;
  } else if(kind === "questions"){
    return startWheel(n);
  } else if(kind === "find"){
    title = "Find someone who…";
    body = `<h1>🕵️ Find someone who…</h1>
      <p class="muted small">Ask your classmates. Write the name when you find someone.</p>
      <div class="card"><ul class="checklist">${s.findSomeone.map((f,i) => `
        <li><span class="box" data-tick="f|${n}|${i}">${P.ticks["f|"+n+"|"+i] ? "✓" : ""}</span><span>${esc(f)}</span></li>`).join("")}</ul></div>
      <div class="tipbox">Make a real question first: "…who can play the guitar" → <b>Can you play the guitar?</b></div>`;
  } else if(kind === "gap"){
    title = "Information gap";
    body = `<h1>🧩 ${esc(s.infoGap.title)}</h1>
      <div class="card"><p style="font-size:17px;font-weight:600">${esc(s.infoGap.how)}</p></div>
      <div class="tipbox">Work in pairs. Don't look at your partner's paper — you must ask.</div>`;
  } else {
    title = "Discussion";
    body = `<h1>💬 Discussion</h1>
      <p class="muted small">Give a reason for every answer. Try to use "because".</p>
      <div class="card"><ol class="qlist">${s.discussion.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>`;
  }

  app.innerHTML = topBar(title) + `<div class="stack">${body}</div>`;
  wireBack();
  app.querySelectorAll("[data-tick]").forEach(b => b.onclick = () => {
    const k = b.dataset.tick;
    P.ticks[k] = !P.ticks[k]; saveProgress();
    b.classList.toggle("on", !!P.ticks[k]);
    b.textContent = P.ticks[k] ? "✓" : "";
  });
  app.querySelectorAll(".checklist .box").forEach(b =>
    b.classList.toggle("on", !!P.ticks[b.dataset.tick]));
}

/* ---- speaking wheel ---- */
function startWheel(n){
  const m = moduleByN(n);
  const qs = m.speaking.questions;
  let current = qs[Math.floor(Math.random() * qs.length)];

  const draw = () => {
    app.innerHTML = topBar("Question cards") + `
    <div class="stack">
      <h1>🎡 Speaking Wheel</h1>
      <p class="muted small">Spin, then answer out loud in full sentences.</p>
      <div class="wheel-face" id="face">${esc(current)}</div>
      <button class="btn primary wide" data-spin>🎡 Spin again</button>
      <button class="btn wide" data-all>See all ${qs.length} questions</button>
    </div>`;
    wireBack();
    $("[data-spin]").onclick = () => {
      const face = $("#face");
      face.classList.add("spin");
      setTimeout(() => {
        let next = current;
        while(next === current && qs.length > 1) next = qs[Math.floor(Math.random() * qs.length)];
        current = next;
        face.textContent = current;
        face.classList.remove("spin");
      }, 320);
    };
    $("[data-all]").onclick = () => go(() => {
      app.innerHTML = topBar("All questions") + `
      <div class="stack"><h1>Question cards</h1>
        <div class="card"><ol class="qlist">${qs.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div></div>`;
      wireBack();
    });
  };
  draw();
}

      <div class="field">

        <p class="tiny muted" style="margin-top:10px">Yours doesn't need to be the same — compare the grammar, not the story.</p></div>` : ""}

      wc.textContent = plural(words, "word", "words");
      wc.classList.toggle("ok", words >= min);

/* ==========================================================================
   12. GAME ENGINES
   ========================================================================== */

let G = null;
let timerId = null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

function startGrammarGame(id, kind){
  const g = grammarById(id);
  const pool = shuffle((g[GAMES[kind].src] || []).slice()).slice(0, ROUND_LENGTH);
  if(!pool.length){ toast("Nothing to practise here yet"); back(); return; }
  G = { kind, topic:g, items:pool, i:0, right:0, missed:[],
        label:g.title + " · " + GAMES[kind].name, key:"g|" + g.id + "|" + kind, link:{ g:g.id, game:kind } };
  renderStep();
}
function startVocabGame(id, kind){
  const v = vocabById(id);
  G = { kind, set:v, i:0, right:0, missed:[],
        label:v.title + " · " + GAMES[kind].name, key:"v|" + v.id + "|" + kind, link:{ v:v.id, game:kind } };
  if(kind === "match")      return startMatch(v);
  if(kind === "memory")     return startMemory(v);
  if(kind === "cards")      return startCards(v);
  if(kind === "unscramble") return startUnscramble(v);
}

function renderStep(){
  stopTimer();
  const fns = { mcq:renderMCQ, timed:renderMCQ, gap:renderGap, drag:renderDrag, build:renderBuild, fix:renderFix };
  (fns[G.kind] || renderMCQ)();
}
function hud(extra){
  return `<div class="hud">
    <div class="bar"><i style="width:${G.i / G.items.length * 100}%"></i></div>
    ${extra || ""}<div class="score">${G.i + 1}/${G.items.length}</div></div>`;
}
function nextButton(){
  const last = G.i === G.items.length - 1;
  return `<button class="btn primary wide" data-next style="margin-top:12px">${last ? "See my result" : "Next"} →</button>`;
}
function wireNext(){
  const b = $("[data-next]");
  if(!b) return;
  b.onclick = () => { G.i++; if(G.i >= G.items.length) finishRound(); else renderStep(); };
  b.focus();
}
function markWrong(q, yours, correct, why){
  G.missed.push({ q, yours, correct, why:why || "" });
}
function renderBlank(text){
  const parts = esc(text).split("___");
  return parts.length > 1 ? parts.join('<span class="blank"></span>') : parts[0];
}

/* ---- multiple choice + timed challenge ---- */
function renderMCQ(){
  const q = G.items[G.i];
  const opts = shuffle([q.a].concat(q.w));
  const keys = ["1","2","3","4"];
  const timed = G.kind === "timed";

  app.innerHTML = topBar(G.label) + `
  <div class="stack">
    ${hud(timed ? `<div class="clock" id="clock">${TIMED_SECONDS}</div>` : "")}
    <p class="question">${renderBlank(q.q)}</p>
    <div class="stack-sm">${opts.map((o,n) =>
      `<button class="opt" data-opt="${esc(o)}"><span class="key">${keys[n]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;

  wireBack();
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answerMCQ(b, q));

  G.keyHandler = e => {
    const n = keys.indexOf(e.key);
    const btns = app.querySelectorAll(".opt:not([disabled])");
    if(n > -1 && btns[n]) btns[n].click();
    else if(e.key === "Enter"){ const nx = $("[data-next]"); if(nx) nx.click(); }
  };
  document.addEventListener("keydown", G.keyHandler);

  if(timed){
    let left = TIMED_SECONDS;
    const clock = $("#clock");
    timerId = setInterval(() => {
      left--;
      clock.textContent = left;
      clock.classList.toggle("low", left <= 5);
      if(left <= 0){ stopTimer(); answerMCQ(null, q, true); }
    }, 1000);
  }
}
function answerMCQ(btn, q, timeout){
  stopTimer();
  document.removeEventListener("keydown", G.keyHandler);
  const chosen = btn ? btn.dataset.opt : "";
  const ok = chosen === q.a;
  if(ok) G.right++;
  else markWrong(q.q, timeout ? "(no answer — time up)" : chosen, q.a, q.why);

  app.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if(b.dataset.opt === q.a) b.classList.add("correct");
    else if(b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const blank = $(".blank");
  if(blank){ blank.textContent = " " + q.a + " "; blank.classList.add("filled"); }

  $("#fb").innerHTML = `
    <div class="feedback ${ok ? "good" : "bad"}">
      <div class="fb-title">${ok ? "Correct" : timeout ? "Time's up!" : "Not quite"}</div>
      ${q.why ? `<div class="small">${esc(q.why)}</div>` : ""}
    </div>${nextButton()}`;
  wireNext();
}

/* ---- fill in the blanks (typing) ---- */
function renderGap(){
  const q = G.items[G.i];
  app.innerHTML = topBar(G.label) + `
  <div class="stack">
    ${hud()}
    <p class="question">${renderBlank(q.q)}</p>
    <div class="field"><label for="ans">Type the missing word</label>
      <input id="ans" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></div>
    <button class="btn primary wide" data-check>Check</button>
    <div id="fb"></div>
  </div>`;
  wireBack();
  const inp = $("#ans");
  inp.focus();
  inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("[data-check]").click(); } };
  $("[data-check]").onclick = () => {
    const ok = normalise(inp.value) === normalise(q.a);
    if(ok) G.right++; else markWrong(q.q, inp.value || "—", q.a, "");
    inp.disabled = true;
    inp.classList.add(ok ? "correct" : "wrong");
    $("[data-check]").classList.add("hide");
    const blank = $(".blank");
    if(blank){ blank.textContent = " " + q.a + " "; blank.classList.add("filled"); }
    $("#fb").innerHTML = `
      <div class="feedback ${ok ? "good" : "bad"}">
        <div class="fb-title">${ok ? "Correct" : "The answer is: " + esc(q.a)}</div>
      </div>${nextButton()}`;
    wireNext();
  };
}

/* ---- drag & drop (tap a word from the bank) ---- */
function renderDrag(){
  const q = G.items[G.i];
  const bank = shuffle((q.bank && q.bank.length ? q.bank : [q.a]).slice());
  app.innerHTML = topBar(G.label) + `
  <div class="stack">
    ${hud()}
    <p class="question">${renderBlank(q.q)}</p>
    <p class="muted small">Tap the word that goes in the gap.</p>
    <div class="chips">${bank.map(b => `<button class="chip-w" data-b="${esc(b)}">${esc(b)}</button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
  wireBack();
  app.querySelectorAll("[data-b]").forEach(b => b.onclick = () => {
    const chosen = b.dataset.b;
    const ok = normalise(chosen) === normalise(q.a);
    if(ok) G.right++; else markWrong(q.q, chosen, q.a, "");
    app.querySelectorAll("[data-b]").forEach(x => {
      x.disabled = true;
      if(normalise(x.dataset.b) === normalise(q.a)) x.style.borderColor = "var(--good)";
      else if(x === b) x.style.borderColor = "var(--bad)";
      else x.classList.add("used");
    });
    const blank = $(".blank");
    if(blank){ blank.textContent = " " + q.a + " "; blank.classList.add("filled"); }
    $("#fb").innerHTML = `
      <div class="feedback ${ok ? "good" : "bad"}">
        <div class="fb-title">${ok ? "Correct" : "The answer is: " + esc(q.a)}</div>
      </div>${nextButton()}`;
    wireNext();
  });
}

/* ---- sentence builder ---- */
function renderBuild(){
  const q = G.items[G.i];
  const words = q.a.split(" ");
  const bank = shuffle(words.map((w,i) => ({ w, i })));
  let picked = [];

  app.innerHTML = topBar(G.label) + `
  <div class="stack">
    ${hud()}
    <p class="muted small">Tap the words in the correct order.</p>
    <div class="answer-area" id="area"><span class="ph">Your sentence appears here</span></div>
    <div class="chips" id="bank">${bank.map(b =>
      `<button class="chip-w" data-i="${b.i}">${esc(b.w)}</button>`).join("")}</div>
    <button class="btn primary wide" data-check disabled>Check</button>
    <div id="fb"></div>
  </div>`;
  wireBack();

  const area = $("#area"), checkBtn = $("[data-check]");
  const redraw = () => {
    area.innerHTML = picked.length
      ? picked.map((p,n) => `<button class="chip-w" data-r="${n}">${esc(p.w)}</button>`).join("")
      : `<span class="ph">Your sentence appears here</span>`;
    checkBtn.disabled = picked.length !== words.length;
    area.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
      const n = +b.dataset.r;
      const back = picked.splice(n,1)[0];
      const chip = $(`#bank [data-i="${back.i}"]`);
      if(chip) chip.classList.remove("used");
      redraw();
    });
  };
  app.querySelectorAll("#bank [data-i]").forEach(b => b.onclick = () => {
    b.classList.add("used");
    picked.push({ w:b.textContent, i:+b.dataset.i });
    redraw();
  });

  checkBtn.onclick = () => {
    const answer = picked.map(p => p.w).join(" ");
    const ok = normalise(answer) === normalise(q.a);
    if(ok) G.right++; else markWrong("Build: " + q.a, answer, q.a, "");
    area.classList.add(ok ? "correct" : "wrong");
    area.querySelectorAll("button").forEach(b => b.disabled = true);
    app.querySelectorAll("#bank [data-i]").forEach(b => b.disabled = true);
    checkBtn.classList.add("hide");
    $("#fb").innerHTML = `
      <div class="feedback ${ok ? "good" : "bad"}">
        <div class="fb-title">${ok ? "Correct" : "Correct sentence:"}</div>
        ${ok ? "" : `<div class="small">${esc(q.a)}</div>`}
      </div>${nextButton()}`;
    wireNext();
  };
}

/* ---- error correction ---- */
function renderFix(){
  const q = G.items[G.i];
  const bad = splitNote(q.bad), good = splitNote(q.good);
  const words = bad.text.split(" ");
  const target = firstDiff(bad.text, good.text);

  app.innerHTML = topBar(G.label) + `
  <div class="stack">
    ${hud()}
    <p class="muted small">One word is wrong. Tap it.</p>
    <div class="card">
      <p class="fix-sentence">${words.map((w,i) => `<span class="fix-w" data-i="${i}">${esc(w)}</span>`).join(" ")}</p>
      ${bad.note ? `<p class="tiny muted">(${esc(bad.note)})</p>` : ""}
    </div>
    <div id="fb"></div>
  </div>`;
  wireBack();

  app.querySelectorAll(".fix-w").forEach(el => el.onclick = () => {
    const i = +el.dataset.i;
    const ok = i === target;
    if(ok) G.right++; else markWrong(bad.text, words[i], good.text, q.why);
    app.querySelectorAll(".fix-w").forEach(x => {
      x.onclick = null;
      if(+x.dataset.i === target) x.classList.add("hit");
      else if(x === el) x.classList.add("miss");
    });
    $("#fb").innerHTML = `
      <div class="feedback ${ok ? "good" : "bad"}">
        <div class="fb-title">${ok ? "Yes — that's the mistake" : "The mistake is: " + esc(words[target] || "")}</div>
        <div class="small" style="margin-top:5px">✓ ${esc(good.text)}</div>
        ${q.why ? `<div class="small muted" style="margin-top:5px">${esc(q.why)}</div>` : ""}
      </div>${nextButton()}`;
    wireNext();
  });
}

/* ---- match the pairs ---- */
function startMatch(v){
  const words = shuffle(v.words).slice(0, MATCH_PAIRS);
  if(words.length < 2){ toast("Not enough words"); back(); return; }
  const cards = [];
  words.forEach((w,i) => {
    cards.push({ id:i, side:"a", text:w.en });
    cards.push({ id:i, side:"b", text:w.meaning });
  });
  G = Object.assign(G || {}, { kind:"match", words, cards:shuffle(cards), sel:null, done:0, tries:0 });
  drawMatch();
}
function drawMatch(){
  app.innerHTML = topBar(G.label) + `
  <div class="stack">
    <div class="hud"><div class="bar"><i style="width:${G.done / G.words.length * 100}%"></i></div>
      <div class="score">${G.done}/${G.words.length}</div></div>
    <p class="muted small">Tap a word, then tap its meaning.</p>
    <div class="grid">${G.cards.map((c,n) => `<button class="tile" data-n="${n}">${esc(c.text)}</button>`).join("")}</div>
  </div>`;
  wireBack();
  app.querySelectorAll(".tile").forEach(t => t.onclick = () => tapMatch(t));
}
function tapMatch(tile){
  if(tile.classList.contains("done")) return;
  const n = +tile.dataset.n, card = G.cards[n];
  if(G.sel === null){ G.sel = n; tile.classList.add("sel"); return; }
  if(G.sel === n){ G.sel = null; tile.classList.remove("sel"); return; }

  const first = app.querySelector(`.tile[data-n="${G.sel}"]`), fc = G.cards[G.sel];
  G.tries++;
  if(fc.id === card.id && fc.side !== card.side){
    [first,tile].forEach(t => { t.classList.remove("sel"); t.classList.add("hit"); });
    G.done++;
    setTimeout(() => {
      [first,tile].forEach(t => { t.classList.remove("hit"); t.classList.add("done"); });
      const bar = $(".bar > i"); if(bar) bar.style.width = (G.done / G.words.length * 100) + "%";
      const sc = $(".score"); if(sc) sc.textContent = G.done + "/" + G.words.length;
      if(G.done === G.words.length) finishRound();
    }, 400);
  } else {
    first.classList.remove("sel");
    [first,tile].forEach(t => t.classList.add("miss"));
    setTimeout(() => [first,tile].forEach(t => t.classList.remove("miss")), 400);
  }
  G.sel = null;
}

/* ---- hidden pairs (memory) ---- */
function startMemory(v){
  const words = shuffle(v.words).slice(0, MEMORY_PAIRS);
  const cards = [];
  words.forEach((w,i) => {
    cards.push({ id:i, text:w.en });
    cards.push({ id:i, text:w.meaning });
  });
  G = Object.assign(G || {}, { kind:"memory", words, cards:shuffle(cards), open:[], done:0, tries:0, busy:false });
  drawMemory();
}
function drawMemory(){
  app.innerHTML = topBar(G.label) + `
  <div class="stack">
    <div class="hud"><div class="bar"><i style="width:${G.done / G.words.length * 100}%"></i></div>
      <div class="score">${G.done}/${G.words.length}</div></div>
    <p class="muted small">Turn over two cards and find the word with its meaning.</p>
    <div class="grid">${G.cards.map((c,n) =>
      `<button class="tile face-down" data-n="${n}">?</button>`).join("")}</div>
  </div>`;
  wireBack();
  app.querySelectorAll(".tile").forEach(t => t.onclick = () => tapMemory(t));
}
function tapMemory(tile){
  if(G.busy || tile.classList.contains("done") || !tile.classList.contains("face-down")) return;
  const n = +tile.dataset.n, card = G.cards[n];
  tile.classList.remove("face-down");
  tile.textContent = card.text;
  G.open.push(n);

  if(G.open.length === 2){
    G.busy = true; G.tries++;
    const [a,b] = G.open.map(i => app.querySelector(`.tile[data-n="${i}"]`));
    const same = G.cards[G.open[0]].id === G.cards[G.open[1]].id && G.open[0] !== G.open[1];
    if(same){
      [a,b].forEach(t => t.classList.add("hit"));
      G.done++;
      setTimeout(() => {
        [a,b].forEach(t => { t.classList.remove("hit"); t.classList.add("done"); });
        const bar = $(".bar > i"); if(bar) bar.style.width = (G.done / G.words.length * 100) + "%";
        const sc = $(".score"); if(sc) sc.textContent = G.done + "/" + G.words.length;
        G.open = []; G.busy = false;
        if(G.done === G.words.length) finishRound();
      }, 500);
    } else {
      [a,b].forEach(t => t.classList.add("miss"));
      setTimeout(() => {
        [a,b].forEach((t,i) => {
          t.classList.remove("miss");
          t.classList.add("face-down");
          t.textContent = "?";
        });
        G.open = []; G.busy = false;
      }, 900);
    }
  }
}

/* ---- flashcards ---- */
function startCards(v){
  const words = shuffle(v.words);
  let i = 0, flipped = false;
  const draw = () => {
    const w = words[i];
    app.innerHTML = topBar(G.label) + `
    <div class="stack">
      <div class="hud"><div class="bar"><i style="width:${i / words.length * 100}%"></i></div>
        <div class="score">${i + 1}/${words.length}</div></div>
      <div class="flashcard" id="fc">
        ${flipped
          ? `<div><div class="fc-mean">${esc(w.meaning)}</div><div class="fc-ex">"${esc(w.ex)}"</div>
             <div class="fc-hint">Tap to see the word again</div></div>`
          : `<div><div class="fc-word">${esc(w.en)}</div><div class="fc-hint">Tap to see the meaning</div></div>`}
      </div>
      <div class="btn-row">
        <button class="btn" data-prev ${i === 0 ? "disabled" : ""}>← Back</button>
        <button class="btn primary" data-next>${i === words.length - 1 ? "Finish" : "Next →"}</button>
      </div>
    </div>`;
    wireBack();
    $("#fc").onclick = () => { flipped = !flipped; draw(); };
    $("[data-prev]").onclick = () => { if(i > 0){ i--; flipped = false; draw(); } };
    $("[data-next]").onclick = () => {
      if(i === words.length - 1){ toast("Well done — you've seen every card"); back(); }
      else { i++; flipped = false; draw(); }
    };
  };
  draw();
}

/* ---- unscramble ---- */
function startUnscramble(v){
  const pool = shuffle(v.words.filter(w => /^[a-zA-Z]{4,}$/.test(w.en))).slice(0, ROUND_LENGTH);
  if(!pool.length){ toast("No single words to scramble here"); back(); return; }
  G = Object.assign(G || {}, { kind:"unscramble", items:pool, i:0, right:0, missed:[] });
  drawUnscramble();
}
function drawUnscramble(){
  const w = G.items[G.i];
  let letters = w.en;
  while(letters === w.en && w.en.length > 2) letters = shuffle(w.en.split("")).join("");

  app.innerHTML = topBar(G.label) + `
  <div class="stack">
    ${hud()}
    <div class="card">
      <p class="muted small center">${esc(w.meaning)}</p>
      <p class="scramble">${esc(letters.toUpperCase())}</p>
    </div>
    <div class="field"><label for="ans">Write the word</label>
      <input id="ans" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></div>
    <button class="btn primary wide" data-check>Check</button>
    <div id="fb"></div>
  </div>`;
  wireBack();
  const inp = $("#ans");
  inp.focus();
  inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("[data-check]").click(); } };
  $("[data-check]").onclick = () => {
    const ok = normalise(inp.value) === normalise(w.en);
    if(ok) G.right++; else markWrong(w.meaning, inp.value || "—", w.en, "");
    inp.disabled = true; inp.classList.add(ok ? "correct" : "wrong");
    $("[data-check]").classList.add("hide");
    $("#fb").innerHTML = `
      <div class="feedback ${ok ? "good" : "bad"}">
        <div class="fb-title">${ok ? "Correct" : "The word is: " + esc(w.en)}</div>
        <div class="small" style="margin-top:4px">"${esc(w.ex)}"</div>
      </div>${nextButton()}`;
    const b = $("[data-next]");
    b.onclick = () => { G.i++; if(G.i >= G.items.length) finishRound(); else drawUnscramble(); };
    b.focus();
  };
}

/* ---- irregular verbs (kept from before) ---- */
function screenVerbsMenu(){
  const levels = uniq(DATA.irregular.map(v => v.level)).sort();
  app.innerHTML = topBar("Irregular verbs") + `
  <div class="stack">
    <h1>🔁 Irregular verbs</h1>
    <p class="muted small">Type the past simple and the past participle.</p>
    <div class="stack-sm">
      ${levels.map(l => `<button class="row" data-vl="${l}"><span class="badge">${l}</span>
        <span class="grow"><span class="row-title">${levelName(l).split(" — ")[1]}</span><br>
        <span class="muted small">${plural(DATA.irregular.filter(v => v.level === l).length,"verb","verbs")}</span></span>
        <span class="chev">›</span></button>`).join("")}
      <button class="row" data-vl="all"><span class="emoji">🎲</span>
        <span class="grow"><span class="row-title">Mixed — all levels</span><br>
        <span class="muted small">${DATA.irregular.length} verbs</span></span><span class="chev">›</span></button>
      <button class="row" data-study><span class="emoji">📖</span>
        <span class="grow"><span class="row-title">Study list</span><br>
        <span class="muted small">See the whole table</span></span><span class="chev">›</span></button>
    </div>
  </div>`;
  wireBack();
  app.querySelectorAll("[data-vl]").forEach(b => b.onclick = () => go(() => startVerbs(b.dataset.vl)));
  $("[data-study]").onclick = () => go(() => {
    app.innerHTML = topBar("Study list") + `
    <div class="stack"><h1>Irregular verbs</h1>
      <div class="card" style="overflow-x:auto"><table class="study">
        <thead><tr><th>Infinitive</th><th>Past</th><th>Participle</th></tr></thead><tbody>
        ${DATA.irregular.map(v => `<tr><td><b>${esc(v.infinitive)}</b></td><td>${esc(v.past)}</td><td>${esc(v.participle)}</td></tr>`).join("")}
      </tbody></table></div></div>`;
    wireBack();
  });
}
function startVerbs(level){
  const pool = shuffle(DATA.irregular.filter(v => level === "all" || v.level === level)).slice(0, ROUND_LENGTH);
  if(!pool.length){ toast("No verbs here yet"); back(); return; }
  G = { kind:"verbs", items:pool, i:0, right:0, missed:[],
        label:"Irregular verbs" + (level === "all" ? "" : " · " + level),
        key:"verbs|" + level, link:{ game:"verbs", level:level === "all" ? "" : level } };
  drawVerb();
}
function accepts(input, answer){
  return answer.split("/").map(normalise).includes(normalise(input));
}
function drawVerb(){
  const v = G.items[G.i];
  app.innerHTML = topBar(G.label) + `
  <div class="stack">
    ${hud()}
    <div class="card">
      <p class="verb-prompt">${esc(v.infinitive)}</p>
      ${v.meaning ? `<p class="muted small center" style="margin-bottom:16px">${esc(v.meaning)}</p>` : ""}
      <div class="stack">
        <div class="field"><label for="p1">Past simple</label>
          <input id="p1" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next"></div>
        <div class="field"><label for="p2">Past participle</label>
          <input id="p2" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></div>
      </div>
    </div>
    <button class="btn primary wide" data-check>Check</button>
    <div id="fb"></div>
  </div>`;
  wireBack();
  const p1 = $("#p1"), p2 = $("#p2");
  p1.focus();
  p1.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); p2.focus(); } };
  p2.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); $("[data-check]").click(); } };
  $("[data-check]").onclick = () => {
    const ok1 = accepts(p1.value, v.past);
    const ok2 = !v.participle || accepts(p2.value, v.participle);
    const ok = ok1 && ok2;
    p1.classList.add(ok1 ? "correct" : "wrong");
    p2.classList.add(ok2 ? "correct" : "wrong");
    p1.disabled = p2.disabled = true;
    if(ok) G.right++;
    else markWrong(v.infinitive, (p1.value || "—") + " / " + (p2.value || "—"), v.past + " / " + v.participle, "");
    $("[data-check]").classList.add("hide");
    $("#fb").innerHTML = `
      <div class="feedback ${ok ? "good" : "bad"}">
        <div class="fb-title">${ok ? "Correct" : esc(v.infinitive + " — " + v.past + " — " + v.participle)}</div>
      </div>${nextButton()}`;
    const b = $("[data-next]");
    b.onclick = () => { G.i++; if(G.i >= G.items.length) finishRound(); else drawVerb(); };
    b.focus();
  };
}

/* ---- legacy A2+ screens ---- */
let legacyTab = "topics";
function screenLegacyLevel(level){
  const topics = topicsIn(level), gram = grammarIn(level);
  if(!topics.length) legacyTab = "grammar";
  if(!gram.length) legacyTab = "topics";
  const list = legacyTab === "topics"
    ? topics.map(t => `<button class="row" data-topic="${esc(t)}"><span class="emoji">📘</span>
        <span class="grow"><span class="row-title">${esc(t)}</span><br>
        <span class="muted small">${plural(vocabFor({level,topic:t}).length,"word","words")}</span></span>
        <span class="chev">›</span></button>`).join("")
    : gram.map(g => `<button class="row" data-grammar="${esc(g)}"><span class="emoji">✏️</span>
        <span class="grow"><span class="row-title">${esc(g)}</span><br>
        <span class="muted small">${plural(quizFor({level,grammar:g}).length,"question","questions")}</span></span>
        <span class="chev">›</span></button>`).join("");

  app.innerHTML = topBar(levelName(level)) + `
  <div class="stack">
    <h1>${levelName(level)}</h1>
    ${(topics.length && gram.length) ? `<div class="seg">
      <button data-tab="topics" aria-selected="${legacyTab === "topics"}">Vocabulary</button>
      <button data-tab="grammar" aria-selected="${legacyTab === "grammar"}">Grammar</button></div>` : ""}
    <div class="stack-sm">${list || '<div class="card muted">Nothing here yet.</div>'}</div>
  </div>`;
  wireBack();
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { legacyTab = b.dataset.tab; screenLegacyLevel(level); });
  app.querySelectorAll("[data-grammar]").forEach(b => b.onclick = () => go(() => startLegacyQuiz({ level, grammar:b.dataset.grammar })));
  app.querySelectorAll("[data-topic]").forEach(b => b.onclick = () => go(() => startLegacyMatch({ level, topic:b.dataset.topic })));
}
function startLegacyQuiz(f){
  const pool = shuffle(quizFor(f)).slice(0, ROUND_LENGTH);
  if(!pool.length){ toast("No questions here yet"); back(); return; }
  G = { kind:"mcq", items:pool.map(q => ({ q:q.question, a:q.correct, w:q.wrong, why:q.explanation })),
        i:0, right:0, missed:[], label:(f.grammar || f.topic) + " · " + f.level,
        key:"legacy|" + f.level + "|" + (f.grammar || f.topic),
        link:{ level:f.level, grammar:f.grammar || "", topic:f.topic || "" } };
  renderStep();
}
function startLegacyMatch(f){
  const words = vocabFor(f).map(v => ({ en:v.english, meaning:v.meaning, ex:"" }));
  G = { kind:"match", label:f.topic + " · " + f.level, key:"legacy|" + f.level + "|" + f.topic,
        link:{ level:f.level, topic:f.topic, game:"match" }, missed:[] };
  startMatch({ words });
}

/* ==========================================================================
   13. FINISH + SHARING
   ========================================================================== */

function finishRound(){
  stopTimer();
  if(G.keyHandler) document.removeEventListener("keydown", G.keyHandler);
  noteRoundPlayed();

  let pct, headline;
  if(G.kind === "match" || G.kind === "memory"){
    const perfect = G.words.length;
    pct = Math.max(0, Math.round(perfect / Math.max(G.tries, perfect) * 100));
    headline = plural(perfect, "pair", "pairs");
  } else {
    pct = Math.round(G.right / G.items.length * 100);
    headline = G.right + " / " + G.items.length;
  }
  if(G.key) recordBest(G.key, pct);

  const praise = pct >= 90 ? "Excellent!" : pct >= 70 ? "Well done!" :
                 pct >= 50 ? "Good effort — keep going." : "Keep practising, you'll get there.";

  app.innerHTML = `
  <div class="stack">
    <div class="card center" style="padding:28px 18px">
      <p class="muted small" style="margin-bottom:10px">${esc(G.label || "")}</p>
      <div class="big-score">${esc(headline)}</div>
      <p style="margin-top:10px;font-weight:650">${praise}</p>
      ${(G.key && P.best[G.key] === pct && pct > 0) ? `<p class="tiny muted" style="margin-top:6px">New personal best</p>` : ""}
    </div>

    ${(G.missed && G.missed.length) ? `<div class="card">
      <h2 style="font-size:16px">Worth reviewing</h2>
      ${G.missed.map(m => `<div class="review">
        <div class="q">${esc(String(m.q).replace(/___/g,"____"))}</div>
        <div class="a">✓ ${esc(m.correct)}</div>
        <div class="yours">✗ you said: ${esc(m.yours)}</div>
        ${m.why ? `<div class="tiny muted" style="margin-top:4px">${esc(m.why)}</div>` : ""}
      </div>`).join("")}</div>` : ""}

    <div class="card">
      <h2 style="font-size:15px">Send your result to your teacher</h2>
      <p class="muted small" style="margin:6px 0 12px">Nothing is sent automatically — you choose.</p>
      <div class="btn-row">
        <button class="btn primary" data-share>Share</button>
        <button class="btn" data-tg>Telegram</button>
        <button class="btn" data-wa>WhatsApp</button>
        <button class="btn" data-copy>Copy</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn primary" data-again>Play again</button>
      <button class="btn" data-home>Back to menu</button>
    </div>
  </div>`;

  const when = new Date().toLocaleDateString("en-GB", { day:"numeric", month:"short" });
  const text = `${P.name ? P.name + " — " : ""}${G.label} — ${headline} (${pct}%) — ${when} · ${SITE_NAME}`;

  $("[data-share]").onclick = () => shareResult(text);
  $("[data-tg]").onclick = () => open("https://t.me/share/url?url=" +
    encodeURIComponent(location.origin + location.pathname) + "&text=" + encodeURIComponent(text), "_blank");
  $("[data-wa]").onclick = () => open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
  $("[data-copy]").onclick = () => copyText(text, "Result copied");
  $("[data-again]").onclick = () => replayRound();
  $("[data-home]").onclick = goHome;

  if(!P.name) setTimeout(askName, 700);
}

function replayRound(){
  if(G.topic) return startGrammarGame(G.topic.id, G.kind);
  if(G.set)   return startVocabGame(G.set.id, G.kind);
  if(G.kind === "verbs") return startVerbs((G.link && G.link.level) || "all");
  back();
}
async function shareResult(text){
  if(navigator.share){ try{ await navigator.share({ text }); return; }catch(e){ return; } }
  copyText(text, "Copied — paste it to your teacher");
}
function askName(){
  const n = prompt("What's your first name? (Only used in the message you send your teacher.)", P.name || "");
  if(n !== null){
    P.name = n.trim().slice(0,24); saveProgress();
    toast(P.name ? "Hi, " + P.name + "!" : "Name cleared");
  }
}

/* ==========================================================================
   14. HOMEWORK LINKS + START UP
   ========================================================================== */

function buildLink(params){
  const u = new URL(location.href.split("?")[0].split("#")[0]);
  Object.keys(params).forEach(k => { if(params[k]) u.searchParams.set(k, params[k]); });
  return u.toString();
}

function openFromURL(){
  const p = new URLSearchParams(location.search);
  const g = p.get("g"), v = p.get("v"), m = p.get("m"), game = (p.get("game") || "").toLowerCase();
  const level = (p.get("level") || "").toUpperCase(), topic = p.get("topic"), grammar = p.get("grammar");

  nav = [screenHome];

  if(g && grammarById(g)){
    if(game && GAMES[game]){ nav.push(() => startGrammarGame(g, game)); startGrammarGame(g, game); }
    else { nav.push(() => screenGrammar(g)); screenGrammar(g); }
    return true;
  }
  if(v && vocabById(v)){
    if(game && GAMES[game]){ nav.push(() => startVocabGame(v, game)); startVocabGame(v, game); }
    else { nav.push(() => screenVocabSet(v)); screenVocabSet(v); }
    return true;
  }
  if(m && moduleByN(m)){ nav.push(() => screenModule(+m)); screenModule(+m); return true; }
  if(game === "verbs"){ nav.push(() => startVerbs(level || "all")); startVerbs(level || "all"); return true; }

  // older link format, still supported
  if(grammar && level){ const f = { level, grammar }; nav.push(() => startLegacyQuiz(f)); startLegacyQuiz(f); return true; }
  if(topic && level){ const f = { level, topic }; nav.push(() => startLegacyMatch(f)); startLegacyMatch(f); return true; }
  if(level){ nav.push(() => screenLegacyLevel(level)); screenLegacyLevel(level); return true; }
  return false;
}

(async function init(){
  loadProgress();
  await loadData();
  nav = [screenHome];
  if(!openFromURL()) screenHome();
})();
</script>
